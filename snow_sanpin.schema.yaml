# Rime schema
# encoding: utf-8

__include: snow_pinyin.schema.yaml:/

schema:
  schema_id: snow_sanpin
  name: 冰雪三拼
  version: "0.3.13"
  author:
    - 谭淞宸 <i@tansongchen.com>
  description: |
    带调拼音词顶功输入方案
    双拼编码：无飞键道·神韵（U357-21X21-M40-D0）
  dependencies:
    - snow_pinyin
    - snow_sanpin_bihua
    - snow_jiandao_jianpin

engine:
  processors:
    - lua_processor@*snow.statistics*processor
    - ascii_composer
    - lua_processor@*snow.shape_processor
    - lua_processor@*snow.select_character
    - lua_processor@*snow.popping
    - recognizer
    - lua_processor@*snow.code_navigator
    - lua_processor@*snow.user_dict
    - lua_processor@*snow.history
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - affix_segmentor@stroke
    - affix_segmentor@pinyin
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - lua_translator@*snow.table_like*t12
    - lua_translator@*snow.table_like*jianpin
    - table_translator@stroke
    - script_translator@pinyin
    - lua_translator@*snow.buffered
    - lua_translator@*snow.datetime
    - lua_translator@*snow.statistics*translator
    - lua_translator@*snow.number
    - lua_translator@*snow.unicode*translator
    - lua_translator@*snow.calculator
    - lua_translator@*snow.history
  filters:
    # 隐藏为补全音节而保留的 (sei1)、(zhei4) 一类占位候选。
    - lua_filter@*snow.placeholder
    - lua_filter@*snow.bihua
    - reverse_lookup_filter@lookup_pinyin
    - reverse_lookup_filter@lookup_sanpin
    - lua_filter@*snow.fix
    - lua_filter@*snow.shape_filter
    - lua_filter@*snow.postpone
    - lua_filter@*snow.simplified
    - simplifier
    - uniquifier
    - lua_filter@*snow.hint
    - lua_filter@*snow.unicode*filter

sanpin_algebra:
  # 无飞键道·神韵（U357-21X21-M40-D0）
  # 目标布局的 421 音节码表中不编码这 5 个扩展音节。
  - erase/^(hng|m|n|ng|ê)\d$/
  # 儿化轻声并入 er5，避免占用单键 r。
  - xform/(^| )r5(?= |$)/$1er5/
  # j/q/x 与零声母 YU 系列统一按 v/van/ve/vn 韵尾编码。
  - xform/([jqx])uan(?=\d)/$1van/
  - xform/([jqx])ue(?=\d)/$1ve/
  - xform/([jqx])un(?=\d)/$1vn/
  - xform/([jqx])u(?=\d)/$1v/
  # 词典来源偶尔使用 ue 书写 üe；在布局层统一并入 ve，不新增独立韵母。
  - xform/ue(?=\d)/ve/
  - xform/(^| )yu/$1Yv/
  # 零声母载体：AOE / Y / W → R / Y / S。
  - xform/(^| )(?=[aoe])/$1R/
  - xform/(^| )y/$1Y/
  - xform/(^| )w/$1S/
  # U357 保持普通声母原键，并将 zh 与 k 合并到 K。
  - xform/(^| )zh/$1K/
  - xform/(^| )ch/$1W/
  - xform/(^| )sh/$1E/
  # 21 键韵母映射；较长韵母必须先处理。
  - xform/iang(?=\d)/J/
  - xform/(uang|ing)(?=\d)/T/
  - xform/(iong|ang)(?=\d)/N/
  - xform/(ian|ong)(?=\d)/P/
  - xform/(iao|ua)(?=\d)/C/
  - xform/(uai|iu)(?=\d)/D/
  - xform/uan(?=\d)/X/
  - xform/(van|eng)(?=\d)/R/
  - xform/(un|in)(?=\d)/B/
  - xform/(vn|ei|er)(?=\d)/E/
  - xform/(ui|v)(?=\d)/G/
  - xform/uo(?=\d)/Y/
  # 扩展读音 gue 规范化为 gve；键道与 gai 共码，三拼可由声调区分。
  - xform/(ve|ai)(?=\d)/K/
  - xform/an(?=\d)/J/
  - xform/(ao|ia)(?=\d)/F/
  - xform/en(?=\d)/M/
  - xform/ou(?=\d)/Q/
  - xform/o(?=\d)/D/
  - xform/ie(?=\d)/Z/
  - xform/a(?=\d)/W/
  - xform/i(?=\d)/L/
  - xform/u(?=\d)/H/
  - xform/e(?=\d)/S/
  - xlit/QWERTYUIOPASDFGHJKLZXCVBNM/qwertyuiopasdfghjklzxcvbnm/
  # 声调
  - xlit/12345/ivuao/

jianpin:
  dictionary: snow_pinyin
  prism: snow_jiandao_jianpin
  packs:
    - snow_pinyin.base
    - snow_pinyin.ext
    - snow_pinyin.tencent
    - snow_pinyin.user

speller:
  alphabet: bpmfdtnlgkhjqxzcsrwyeBPMFDTNLGKHJQXZCSRWYEivuao
  initials: bpmfdtnlgkhjqxzcsrwye
  delimiter: " "
  shape:
    # 天然空音码的 AA 是声声二字词；仅接受一个第二字声调辅码。
    - match_config: "translator/vacant_initial_pattern"
      match_shape: "^$"
      reject_combined_config: "translator/reserved_letter_pattern"
      accept: "[ivuao]"
      status: initial_pair
    - match_config: "translator/vacant_initial_pattern"
      match_shape: ".+"
      accept: "[ivuao]"
      block: true
    - match: "[bpmfdtnlgkhjqxzcsrywe][a-z][ivuao]?"
      accept: "1"
    - match_shape: "1"
      accept: "[a-z]"
    - match: "[bpmfdtnlgkhjqxzcsrywe][a-z][ivuao]"
      accept: "[ivuao]"
    - match: "[bpmfdtnlgkhjqxzcsrywe][a-z][ivuao]"
      match_shape: ".+"
      accept: "[ivuao]"
  popping:
    # 630、单字和三字词
    - when: popping
      match: "(?:[bpmfdtnlgkhjqxzcsrywe][A-Z]?){1,3}[ivuao]+"
      accept: "[bpmfdtnlgkhjqxzcsrywe]"
    # 四字词和多字词
    - when: popping
      match: "(?:[bpmfdtnlgkhjqxzcsrywe][A-Z]?){4,}[ivuao]*"
      accept: "[bpmfdtnlgkhjqxzcsrywe]"
    # 已有至少四个小写声母时，大写转成小写追加下一字的声母。
    - when: popping
      match: "(?=(?:[A-Z]*[a-z]){4})[bpmfdtnlgkhjqxzcsrywe][a-zA-Z]*"
      accept: "[BPMFDTNLGKHJQXZCSRYWE]"
      strategy: append
    # 不足四个小写声母时，大写原样追加为前一字的韵母；仅服务三字及以上简拼。
    - when: popping
      match: "(?:[bpmfdtnlgkhjqxzcsrywe][A-Z]?){0,2}[bpmfdtnlgkhjqxzcsrywe]"
      accept: "[BPMFDTNLGKHJQXZCSRYWE]"
      strategy: append_raw
    # 顶标点
    - match: ".*[^a-z0-9]"
      accept: "[bpmfdtnlgkhjqxzcsrywe]"
    # 标点大写顶
    - match: ".*[a-z0-9]"
      accept: "[^a-z0-9 ]"
  algebra:
    __include: /sanpin_algebra
    __append:
      # 与键道共享二键基码，并统一追加轻声键 o；tco/hco/xko 的字母固顶覆盖新增的轻声读音。
      - xform/~{1,2}([bpmfdtnlgkhjqxzcsrywe])/$1co/
      - xform/~{1,2}v/xgo/
      - xform/~{1,2}i/xlo/
      - xform/~{1,2}u/xho/
      - xform/~{1,2}o/xdo/
      - xform/~{1,2}a/xwo/
      - abbrev/^([a-z]).+$/$1/ # 简拼
      - derive/[ivuao]$// # 无声调

lookup_sanpin:
  tags: [pinyin]
  overwrite_comment: true
  dictionary: snow_pinyin
  comment_format:
    __include: /sanpin_algebra
    __append:
      - xform/q([zhe])/f$1/

__patch:
  - patch
  - snow_sanpin.custom:/patch?

patch:
  switches/+:
    - options: [fluid, popping]
      states: [整句, 四顶]
      reset: 1
    - name: buffered
      states: [结束, 缓冲]
      reset: 0
  translator/prism: snow_sanpin
  translator/preedit_format: null
  translator/enable_schema_user_dict: true
  translator/shape_elements: snow_bushou
  translator/shape_mapping: "radical_sanpin.txt"
  translator/vacant_initial_pattern: "^(?:bg|bq|bx|bs|by|pg|px|ps|py|mg|mx|my|fb|fp|ff|ft|fl|fg|fk|fx|fz|fs|fy|tm|td|lm|gl|gz|kz|hl|hz|jm|jh|jq|jx|js|jw|jy|qm|qh|qq|qx|qs|qw|qy|xm|xh|xq|xx|xs|xw|xy|zd|zt|zz|zc|cd|ct|cz|cc|st|sz|sc|rt|rz|wz|we|ym|yh|yx|yz|yc|yy|ep|ez)$"
  # 这些天然空二码追加 o 后是保留字母全码，不能把 o 当作声声二字词辅码吞掉。
  translator/reserved_letter_pattern: "^(?:zco|cco|sco|yco|xho|xwo)$"
  translator/t1_pattern: "[bpmfdtnlgkhjqxzcsrywe][a-z]?[ivuao]?"
  translator/t2_pattern: "[bpmfdtnlgkhjqxzcsrywe]{4}[ivuao]{0,2}"
  translator/jianpin_pattern: "(?:[bpmfdtnlgkhjqxzcsrywe][A-Z]?){3,}[ivuao]{0,3}"
  # 神韵四声母简拼碰撞较多；显式保留双字代理码原有的长度质量，避免简拼压过双字全码。
  translator/t12_preserve_proxy_quality: true
  # 与四拼一致：先顶出当前候选，再直接提交高频尾字。
  # 保留 d→的、l→了，;/ 只作为可选的强制上屏尾字键。
  punctuator/half_shape/+:
    ";": 的
    "|": ；
    "/": 了
    "\\": 、
  key_binder/bindings/+:
    - { when: always, accept: "Control+period", toggle: buffered }
    - { when: always, accept: v, toggle: buffered }
    - { when: composing, accept: v, send: v }
  menu/alternative_select_keys: "_23890"
  stroke/prism: snow_sanpin_bihua
  stroke/preedit_format: [xlit/ivuao/一丨丿丶乙/]
