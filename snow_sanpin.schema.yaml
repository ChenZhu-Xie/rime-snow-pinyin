# Rime schema
# encoding: utf-8

__include: snow_pinyin.schema.yaml:/

schema:
  schema_id: snow_sanpin
  name: 冰雪三拼
  version: "0.4"
  author:
    - 谭淞宸 <i@tansongchen.com>
  description: |
    带调拼音词顶功输入方案
    双拼编码：零飞键道·神韵 v1（NF3-21X21-M40-44）
  dependencies:
    - snow_pinyin
    - snow_bihua

engine:
  processors:
    - ascii_composer
    - recognizer
    - lua_processor@*snow.shape_processor
    - lua_processor@*snow.history
    - key_binder
    - lua_processor@*snow.abbreviation
    - lua_processor@*snow.select_character
    - lua_processor@*snow.popping
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - affix_segmentor@stroke
    - affix_segmentor@pinyin
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - lua_translator@*snow.table_like*t12
    - lua_translator@*snow.table_like*jianpin
    - table_translator@stroke
    - script_translator@pinyin
    - lua_translator@*snow.datetime
    - lua_translator@*snow.number
    - lua_translator@*snow.calculator
    - lua_translator@*snow.history
  filters:
    - reverse_lookup_filter@lookup_pinyin
    - reverse_lookup_filter@lookup_sanpin
    - lua_filter@*snow.fix
    - lua_filter@*snow.shape_filter
    - lua_filter@*snow.postpone
    - uniquifier
    - simplifier
    - lua_filter@*snow.hint

sanpin_algebra:
  # 零飞键道·神韵 v1（NF3-21X21-M40-44）
  # 目标布局的 421 音节码表中不编码这 5 个扩展音节。
  - erase/^(hng|m|n|ng|ê)\d$/
  # 零声母载体：AOE / Y / W → Q / F / J。
  - xform/(^| )(?=[aoe])/$1Q/
  - xform/(^| )y/$1F/
  - xform/(^| )w/$1J/
  # 按书写韵母编码：ju/jue 使用 u/ue；v/ve 留给 lü、nü 一类音节。
  # 21 个普通声母各使用一个固定首键。
  - xform/(^| )zh/$1E/
  - xform/(^| )ch/$1W/
  - xform/(^| )sh/$1Y/
  # 21 键韵母映射；较长韵母必须先处理。
  - xform/(iang|ui)(?=\d)/F/
  - xform/(ing|uang)(?=\d)/K/
  - xform/(iao)(?=\d)/C/
  - xform/(ao|iong)(?=\d)/Y/
  - xform/(ian|ua)(?=\d)/G/
  - xform/(ie|uai)(?=\d)/B/
  - xform/(uan|v)(?=\d)/M/
  - xform/(un|ve)(?=\d)/T/
  - xform/ang(?=\d)/Q/
  - xform/an(?=\d)/J/
  - xform/eng(?=\d)/R/
  - xform/(ai|ue)(?=\d)/H/
  - xform/(ei|er)(?=\d)/E/
  - xform/en(?=\d)/Z/
  - xform/(in|uo)(?=\d)/D/
  - xform/(iu|ou)(?=\d)/X/
  - xform/(ong|o)(?=\d)/W/
  - xform/(e|ia)(?=\d)/S/
  - xform/i(?=\d)/P/
  - xform/a(?=\d)/N/
  - xform/u(?=\d)/L/
  - xlit/QWERTYUIOPASDFGHJKLZXCVBNM/qwertyuiopasdfghjklzxcvbnm/
  # 声调
  - xlit/12345/ivuao/

jianpin:
  dictionary: snow_pinyin
  prism: snow_jiandao_jianpin
  packs:
    - snow_pinyin.base
    - snow_pinyin.ext
    - snow_pinyin.tencent
    - snow_pinyin.user

jianpin2:
  dictionary: snow_pinyin
  prism: snow_jiandao_jianpin
  packs:
    - snow_pinyin.base
    - snow_pinyin.ext
    - snow_pinyin.tencent
    - snow_pinyin.user

speller:
  alphabet: bpmfdtnlgkhjqxzcsrwyeivuao
  initials: bpmfdtnlgkhjqxzcsrwye
  delimiter: " "
  shape:
    - match: "[bpmfdtnlgkhjqxzcsrywe][a-z][ivuao]?"
      accept: "1"
    - match_shape: "1"
      accept: "[a-z]"
    - match: "[bpmfdtnlgkhjqxzcsrywe][a-z][ivuao]"
      accept: "[ivuao]"
    - match_shape: ".+"
      accept: "[ivuao]"
  popping:
    # 630
    - when: popping
      match: "[bpmfdtnlgkhjqxzcsrywe][ivuao]+"
      accept: "[bpmfdtnlgkhjqxzcsrywe]"
    # 单字和三字词
    - when: popping
      match: "[bpmfdtnlgkhjqxzcsrywe]{2,3}[ivuao]+"
      accept: "[bpmfdtnlgkhjqxzcsrywe]"
    # 四字词和多字词
    - when: popping
      match: "[bpmfdtnlgkhjqxzcsrywe]{4,}[ivuao]*"
      accept: "[bpmfdtnlgkhjqxzcsrywe]"
    # 大写参与编码
    - when: popping
      match: "[bpmfdtnlgkhjqxzcsrywe][a-z]{3,}"
      accept: "[BPMFDTNLGKHJQXZCSRYWE]"
      strategy: append
    # 顶标点
    - match: ".*[^a-z0-9]"
      accept: "[bpmfdtnlgkhjqxzcsrywe]"
    # 标点大写顶
    - match: ".*[a-z0-9]"
      accept: "[^a-z0-9 ]"
  algebra:
    __include: /sanpin_algebra
    __append:
      - abbrev/^([a-z]).+$/$1/ # 简拼
      - derive/[ivuao]$// # 无声调

lookup_sanpin:
  tags: [pinyin]
  overwrite_comment: true
  dictionary: snow_pinyin
  comment_format:
    __include: /sanpin_algebra

__patch:
  - patch
  - snow_sanpin.custom:/patch?

patch:
  switches/+:
    - options: [fluid, popping]
      states: [整句, 四顶]
      reset: 1
    - name: buffered
      states: [结束, 缓冲]
      reset: 0
  translator/prism: snow_sanpin
  translator/preedit_format: null
  translator/t1_pattern: "[bpmfdtnlgkhjqxzcsrywe][a-z]?[ivuao]?"
  translator/t2_pattern: "[bpmfdtnlgkhjqxzcsrywe]{4}[ivuao]{0,2}"
  translator/jianpin_pattern: "[bpmfdtnlgkhjqxzcsrywe]{3,}[ivuao]{0,3}"
  key_binder/bindings/+:
    - { when: always, accept: "Control+period", toggle: buffered }
    - { when: always, accept: v, toggle: buffered }
    - { when: composing, accept: v, send: v }
  menu/alternative_select_keys: null
