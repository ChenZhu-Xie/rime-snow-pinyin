<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="530" viewBox="0 0 1420 530" role="img" aria-labelledby="title desc">
<title id="title">零飞键道·神韵 v1 双拼键盘图</title>
<desc id="desc">NF3-21X21-M40-44 的 21 键声韵映射及 AVUIO 五个声调与形码辅键。</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f3f0e9"/><stop offset="1" stop-color="#ece9e1"/>
  </linearGradient>
  <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#dde7df"/><stop offset="0.58" stop-color="#e8ebe4"/><stop offset="1" stop-color="#ede4df"/>
  </linearGradient>
  <linearGradient id="soundCap" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#edf1eb"/>
  </linearGradient>
  <linearGradient id="auxCap" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7f2f8"/><stop offset="1" stop-color="#e8e1eb"/>
  </linearGradient>
  <filter id="keyShadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#43564d" flood-opacity="0.16"/>
  </filter>
</defs>
<style>
  text{font-family:"Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;fill:#43564d}
  .title{font-size:32px;font-weight:760;letter-spacing:.03em}.subtitle{font-size:17px;fill:#657469}
  .key{stroke-width:2.5;filter:url(#keyShadow)}.sound-key{fill:url(#soundCap);stroke:#82988c}.aux-key{fill:url(#auxCap);stroke:#aaa0b2}
  .letter{font-size:27px;font-weight:800;fill:#354d43}.initial{font-size:19px;font-weight:700;fill:#3f6252}.final{font-size:20px;font-weight:650;fill:#675c70}.aux{font-size:19px;font-weight:700;fill:#675c70}
  .legend{font-size:16px;fill:#62685f}.badge{fill:#e5ece7;stroke:#cad5cd;stroke-width:1.5}
</style>
<rect width="1420" height="530" fill="url(#paper)"/>
<rect x="12" y="12" width="1396" height="68" rx="12" fill="url(#header)" stroke="#c3cdc1"/>
<text class="title" x="24" y="42">零飞键道·神韵 v1</text>
<text class="subtitle" x="24" y="70">NF3-21X21-M40-44 · 21×21 声韵键域 · M=40 · AVUIO 五辅键</text>
<rect class="badge" x="1050" y="27" width="346" height="43" rx="21"/>
<text class="legend" x="1223" y="54" text-anchor="middle">ØAOE→Q　ØY→F　ØW→J</text>
<g><rect class="key sound-key" x="24" y="98" width="128" height="118" rx="12"/><text class="letter" x="38" y="127">Q</text><text class="initial" x="38" y="159">q · ØAOE</text><text class="final" x="38" y="189">ang</text></g><g><rect class="key sound-key" x="162" y="98" width="128" height="118" rx="12"/><text class="letter" x="176" y="127">W</text><text class="initial" x="176" y="159">ch</text><text class="final" x="176" y="189">o · ong</text></g><g><rect class="key sound-key" x="300" y="98" width="128" height="118" rx="12"/><text class="letter" x="314" y="127">E</text><text class="initial" x="314" y="159">zh</text><text class="final" x="314" y="189">ei · er</text></g><g><rect class="key sound-key" x="438" y="98" width="128" height="118" rx="12"/><text class="letter" x="452" y="127">R</text><text class="initial" x="452" y="159">r</text><text class="final" x="452" y="189">eng</text></g><g><rect class="key sound-key" x="576" y="98" width="128" height="118" rx="12"/><text class="letter" x="590" y="127">T</text><text class="initial" x="590" y="159">t</text><text class="final" x="590" y="189">un · ve</text></g><g><rect class="key sound-key" x="714" y="98" width="128" height="118" rx="12"/><text class="letter" x="728" y="127">Y</text><text class="initial" x="728" y="159">sh</text><text class="final" x="728" y="189">ao · iong</text></g><g><rect class="key aux-key" x="852" y="98" width="128" height="118" rx="12"/><text class="letter" x="866" y="127">U</text><text class="aux" x="916" y="168" text-anchor="middle">三声 · 撇</text></g><g><rect class="key aux-key" x="990" y="98" width="128" height="118" rx="12"/><text class="letter" x="1004" y="127">I</text><text class="aux" x="1054" y="168" text-anchor="middle">一声 · 竖</text></g><g><rect class="key aux-key" x="1128" y="98" width="128" height="118" rx="12"/><text class="letter" x="1142" y="127">O</text><text class="aux" x="1192" y="168" text-anchor="middle">轻声 · 点</text></g><g><rect class="key sound-key" x="1266" y="98" width="128" height="118" rx="12"/><text class="letter" x="1280" y="127">P</text><text class="initial" x="1280" y="159">p</text><text class="final" x="1280" y="189">i</text></g><g><rect class="key aux-key" x="93" y="226" width="128" height="118" rx="12"/><text class="letter" x="107" y="255">A</text><text class="aux" x="157" y="296" text-anchor="middle">四声 · 折</text></g><g><rect class="key sound-key" x="231" y="226" width="128" height="118" rx="12"/><text class="letter" x="245" y="255">S</text><text class="initial" x="245" y="287">s</text><text class="final" x="245" y="317">e · ia</text></g><g><rect class="key sound-key" x="369" y="226" width="128" height="118" rx="12"/><text class="letter" x="383" y="255">D</text><text class="initial" x="383" y="287">d</text><text class="final" x="383" y="317">in · uo</text></g><g><rect class="key sound-key" x="507" y="226" width="128" height="118" rx="12"/><text class="letter" x="521" y="255">F</text><text class="initial" x="521" y="287">f · ØY</text><text class="final" x="521" y="317">iang · ui</text></g><g><rect class="key sound-key" x="645" y="226" width="128" height="118" rx="12"/><text class="letter" x="659" y="255">G</text><text class="initial" x="659" y="287">g</text><text class="final" x="659" y="317">ian · ua</text></g><g><rect class="key sound-key" x="783" y="226" width="128" height="118" rx="12"/><text class="letter" x="797" y="255">H</text><text class="initial" x="797" y="287">h</text><text class="final" x="797" y="317">ai · ue</text></g><g><rect class="key sound-key" x="921" y="226" width="128" height="118" rx="12"/><text class="letter" x="935" y="255">J</text><text class="initial" x="935" y="287">j · ØW</text><text class="final" x="935" y="317">an</text></g><g><rect class="key sound-key" x="1059" y="226" width="128" height="118" rx="12"/><text class="letter" x="1073" y="255">K</text><text class="initial" x="1073" y="287">k</text><text class="final" x="1073" y="317">ing · uang</text></g><g><rect class="key sound-key" x="1197" y="226" width="128" height="118" rx="12"/><text class="letter" x="1211" y="255">L</text><text class="initial" x="1211" y="287">l</text><text class="final" x="1211" y="317">u</text></g><g><rect class="key sound-key" x="231" y="354" width="128" height="118" rx="12"/><text class="letter" x="245" y="383">Z</text><text class="initial" x="245" y="415">z</text><text class="final" x="245" y="445">en</text></g><g><rect class="key sound-key" x="369" y="354" width="128" height="118" rx="12"/><text class="letter" x="383" y="383">X</text><text class="initial" x="383" y="415">x</text><text class="final" x="383" y="445">iu · ou</text></g><g><rect class="key sound-key" x="507" y="354" width="128" height="118" rx="12"/><text class="letter" x="521" y="383">C</text><text class="initial" x="521" y="415">c</text><text class="final" x="521" y="445">iao</text></g><g><rect class="key aux-key" x="645" y="354" width="128" height="118" rx="12"/><text class="letter" x="659" y="383">V</text><text class="aux" x="709" y="424" text-anchor="middle">二声 · 横</text></g><g><rect class="key sound-key" x="783" y="354" width="128" height="118" rx="12"/><text class="letter" x="797" y="383">B</text><text class="initial" x="797" y="415">b</text><text class="final" x="797" y="445">ie · uai</text></g><g><rect class="key sound-key" x="921" y="354" width="128" height="118" rx="12"/><text class="letter" x="935" y="383">N</text><text class="initial" x="935" y="415">n</text><text class="final" x="935" y="445">a</text></g><g><rect class="key sound-key" x="1059" y="354" width="128" height="118" rx="12"/><text class="letter" x="1073" y="383">M</text><text class="initial" x="1073" y="415">m</text><text class="final" x="1073" y="445">uan · v</text></g>
<text class="legend" x="24" y="510">绿色：声母 / 韵母　　紫色：声调 / 形码　　声调 I/V/U/A/O＝一/二/三/四/轻；形码 A/V/U/I/O＝折/横/撇/竖/点</text>
</svg>
