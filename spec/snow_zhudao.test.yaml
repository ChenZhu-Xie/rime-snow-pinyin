schema: snow_zhudao
source_dir: ..
script: |
  function rank(text)
    for index, candidate in ipairs(cand) do
      if candidate.text == text then return index end
    end
    return math.huge
  end
  function has(text) return rank(text) < math.huge end
  function page(text) return rank(text) <= 6 end
  function comment(text) return has(text) and cand[rank(text)].comment or "" end
  function remember_top()
    six_code_top = cand[1].text
    return true
  end
deploy:
  popping:
    tests:
      # 与评测的无学习冷态候选一致；不能把第五候选当作首选短码。
      - send: yvd
        assert: cand[1].text == "形式的" and rank("新时代") > 1 and commit == nil
      - send: yvdho
        assert: cand[1].text == "新时代" and commit == nil
      # 固顶只检查一例；字母入口按鹮道的实际占用桶重新选择。
      - send: d
        assert: cand[1].text == "都"
      - send: bm
        assert: cand[2].text == "B" and cand[3].text == "b"
      # 固顶兜底按实际读音权重；尿的 niào 高频不能抬高其 suī 异读。
      - send: sx
        assert: cand[1].text == "吹" and has("虽") and has("尿")
      # 同一韵组由声调决定第二码；后置形辅不再输入声调。
      - send: bn
        assert: has("冰") and preedit == "bn"
      - send: bno
        assert: has("冰") and preedit == "bn 形[o]"
      - send: br
        assert: has("饼")
      - send: bl
        assert: has("病")
      # 词语主码仍为 AUAU / AAA / AAAU / AAAA。
      - send: cjvk
        assert: has("测试") and commit == nil and preedit == "cj vk"
      - send: bnyweo
        assert: has("冰雪") and commit == nil
      - send: vrf
        assert: has("输入法")
      - send: vrfp
        assert: has("输入法") and commit == nil
      - send: vrfpeu
        assert: has("输入法") and preedit == "v r fp 形[eu]" and commit == nil
      # ko 是空桶，三字词第四码 o 直接进入 AAA+B 的形辅回收路由。
      - send: vjkoi
        assert: has("数据库") and commit == nil
      - send: rgxneu
        assert: has("人工智能") and commit == nil
      # 原有单字桶不得被声声回收；ko 的第二码是辅键，不能回收成二字词。
      - send: cv
        assert: has("粗") and not has("测试")
      - send: ko
        assert: "#cand == 0 and commit == nil"
      # 空桶提示与当前声声桶首选保持一致。
      - send: f
        assert: cand[1].text == "发" and cand[2].text == "负责" and cand[2].comment == "fz"
      - send: "cjvk;"
        assert: commit == "测试的"
      - send: "cjvk/"
        assert: commit == "测试了"
  initial_pair_four_aux:
    tests:
      # bd 空桶：「不」的前两辅 eu，然后「到」的前两辅 ea，逐字逐字追加。
      - send: bd
        assert: has("不到") and comment("不到"):find("〔形₁₁₂₂ eu〕", 1, true) ~= nil
      - send: bde
        assert: has("不到") and commit == nil
      - send: bdeu
        assert: has("不到") and comment("不到"):find("〔形₁₁₂₂ ea〕", 1, true) ~= nil
      - send: bdeue
        assert: has("不到") and commit == nil
      - send: bdeuea
        assert: has("不到") and not comment("不到"):find("〔形₁₁₂₂", 1, true) and commit == nil
      - send: bdeuea{BackSpace}
        assert: has("不到") and comment("不到"):find("〔形₁₁₂₂ a〕", 1, true) ~= nil
  six_code_popping:
    tests:
      # 四辅全码可能仍有重码；应顶出这个码的实际首选，而非固定某个词。
      - send: bdeuea
        assert: has("不到") and remember_top()
      - send: bdeueab
        assert: (commit == six_code_top and preedit == "b") or error("top=" .. tostring(six_code_top) .. ", commit=" .. tostring(commit) .. ", preedit=" .. tostring(preedit))
  initial_pair_reverse_policy:
    patch:
      translator/word_auxiliary_order: "12"
    tests:
      - send: bd
        assert: has("不到") and comment("不到"):find("〔形₂₂₁₁ ea〕", 1, true) ~= nil
      - send: bdeaeu
        assert: has("不到") and commit == nil
  initial_pair_learning:
    tests:
      # 「报答」在 bdiu 桶不是首选，六码 bdiuue 在当前词库中唯一。
      - send: bdiu
        assert: has("报答") and cand[1].text ~= "报答"
      - send: bdiuue
        assert: cand[1].text == "报答"
      - send: "bdiuue bdiu"
        assert: cand[1].text == "报答"
  reverse_lookup:
    tests:
      - send: uwangyan
        assert: page("琰") and comment("琰"):find("yan3", 1, true) ~= nil
      - send: ueiuoa
        assert: cand[1].text == "札"
  buffered_command:
    tests:
      - send: o
        assert: cand[1].text == "📝 开启缓冲"
      - send: otj
        assert: cand[1].text == "📖 统计功能说明"
