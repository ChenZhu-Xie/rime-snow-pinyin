schema: snow_sanpin_classic
source_dir: ..
script: |
  function has(something)
    for _, v in ipairs(cand) do
      if v.text == something then
        return true
      end
    end
    return false
  end
deploy:
  sentence:
    patch:
      'switches/@4/reset': 0
    tests:
      - send: bgxhpbyb
        assert: cand[1].text == "冰雪拼音"
  popping:
    tests:
      # 组词规则
      - send: bgv
        assert: cand[1].text == "冰"
      - send: bgxh
        assert: has("冰雪")
      - send: jbekoo
        assert: has("近世")
      - send: erf
        assert: has("输入法")
      - send: bhhviv
        assert: has("白花花")
      - send: wmxw
        assert: has("充满希望")
      - send: jjjjov
        assert: has("经济基础")
      - send: fwerF
        assert: has("中文输入法")
      - send: fhrmGHG
        assert: has("中华人民共和国")
      # 后续版本迁入：三字及以上简拼的前三字可用大写韵键补全。
      - send: eJrf
        assert: has("输入法")
      - send: erJf
        assert: has("输入法")
      - send: erfS
        assert: has("输入法")
      - send: eJrJfS
        assert: has("输入法")
      - send: zKxGwE
        assert: has("自行车")
      # 固顶词
      - send: p
        assert: cand[1].text == "平"
      # 单字定字：[ 重复该字，] 在该字后追加“得”
      - send: "p["
        assert: commit == "平平"
      - send: "p]"
        assert: commit == "平得"
      - send: xh
        assert: cand[1].text == "学"
      - send: be
        assert: cand[1].text == "表示"
      - send: yo
        assert: cand[1].text == "一个"
      # 首选后置
      - send: ekek
        assert: cand[1].text == "事实"
      - send: ekeko
        assert: cand[2].text == "事实"
      # 顶功
      - send: yoyo
        assert: commit == "一个" and cand[1].text == "一个"
      - send: bgvxhu
        assert: commit == "冰" and cand[1].text == "雪"
      - send: pbyberf
        assert: commit == "拼音" and cand[1].text == "输入法"
      # 动态码长
      - send: "ekekovekek"
        assert: cand[1].text == "誓师"
      # 缓冲造词
      - send: "{Control+b}jp mzv  jpmz"
        assert: cand[1].text == "长猫"
