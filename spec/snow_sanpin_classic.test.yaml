schema: snow_sanpin_classic
source_dir: ..
script: |
  function has(something)
    for _, v in ipairs(cand) do
      if v.text == something then
        return true
      end
    end
    return false
  end
  function comment(something)
    for _, v in ipairs(cand) do
      if v.text == something then return v.comment end
    end
    return ""
  end
  function pair_comment(text)
    for _, candidate in ipairs(cand) do
      if candidate.text == text then return candidate.comment end
    end
    return ""
  end
  function pair_probe()
    local parts = { "preedit=" .. tostring(preedit), "commit=" .. tostring(commit) }
    for index = 1, math.min(16, #cand) do
      parts[#parts + 1] = tostring(index) .. ":" .. cand[index].text .. "/" .. cand[index].comment
    end
    return table.concat(parts, " | ")
  end
deploy:
  short_shape_and_stroke_sources:
    tests:
      - send: jmii
        assert: commit == nil and cand[1].text == "尖"
      - send: jnviu
        assert: commit == nil and cand[1].text == "尘"
  word_length_selection:
    tests:
      - send: "rgfn{less}"
        assert: commit == "人工智能"
      - send: "kxfq{greater}"
        assert: commit == "科学发展观"
      # 不足四主码时沿用原有书名号行为。
      - send: "d{less}"
        assert: commit == "都《"
  entry_contract:
    tests:
      # 生僻字补桶须为真实词典候选，不能只由 fixed 兜底造出同名候选。
      - send: cn
        assert: cand[1].text == "岑" and cand[1].comment:find("📌", 1, true)
  traditional_entry_contract:
    options:
      traditionalization: true
    tests:
      - send: l
        assert: cand[1].text == "來"
  cross_route_user_phrase:
    tests:
      # 用前三字完整声韵、第四字声母唯一上屏“方案选单”，再退回 fxxd 验证跨路径用户词优先。
      - send: "fPxFxTd fxxd"
        assert: cand[1].text == "方案选单"
  sentence:
    patch:
      'switches/@4/reset': 0
    tests:
      - send: bgxhpbyb
        assert: cand[1].text == "冰雪拼音"
  popping:
    tests:
      # 组词规则
      - send: bgi
        assert: cand[1].text == "冰"
      # 未键入调辅时，单字、三字词、四字词分别提示下一至两个调辅键。
      - send: bg
        assert: has("冰") and comment("冰"):find("〔调 i〕", 1, true)
      - send: erf
        assert: has("输入法") and comment("输入法"):find("〔调₂₁₃ ai〕", 1, true)
      - send: jjjj
        assert: has("经济基础") and comment("经济基础"):find("〔调₂₃ ai〕", 1, true)
      - send: bgxh
        assert: has("冰雪")
      - send: jbekaa
        assert: has("近世")
      - send: erf
        assert: has("输入法")
      - send: bhhivi
        assert: has("白花花")
      - send: wmxw
        assert: has("充满希望")
      - send: jjjjai
        assert: has("经济基础")
      - send: fwerF
        assert: has("中文输入法")
      - send: fhrmGHG
        assert: has("中华人民共和国")
      # 后续版本迁入：三字及以上简拼的前三字可用大写韵键补全。
      - send: eJrf
        assert: has("输入法")
      - send: erJf
        assert: has("输入法")
      - send: erfS
        assert: has("输入法")
      - send: eJrJfS
        assert: has("输入法")
      - send: zKxGwE
        assert: has("自行车")
      # 固顶词
      - send: d
        assert: cand[1].text == "都"
      - send: p
        assert: cand[1].text == "跑"
      # 单字定字：[ 重复该字，] 在该字后追加“得”
      - send: "p["
        assert: commit == "跑跑"
      - send: "p]"
        assert: commit == "跑得"
      - send: xh
        assert: cand[1].text == "学"
      - send: be
        assert: cand[1].text == "不是"
      - send: ya
        assert: cand[1].text == "一个"
      - send: coo
        assert: cand[1].text == "存着呢"
      # 字母全码沿用冰雪键道二键基码，并追加现行 21×21 轻声键 o。
      - send: bco
        assert: cand[1].text == "B" and cand[2].text == "b"
      - send: xgo
        assert: cand[1].text == "V" and cand[2].text == "v"
      # 一至四沿用已有数字汉字短码，其余数字使用完整声韵调码。
      - send: xj
        assert: cand[1].text == "二" and cand[2].text == "2"
      - send: wju
        assert: cand[1].text == "五" and cand[2].text == "5"
      - send: lgv
        assert: cand[1].text == "零" and cand[2].text == "0"
      # 首选后置
      - send: ekek
        assert: cand[1].text == "事实"
      - send: ekeka
        assert: cand[2].text == "事实"
      # 顶功
      - send: yaya
        assert: commit == "一个" and cand[1].text == "一个"
      - send: bgixhu
        assert: commit == "冰" and cand[1].text == "雪"
      - send: pbyberf
        assert: commit == "拼音" and cand[1].text == "输入法"
      # 动态码长
      - send: "ekekaiekek"
        assert: cand[1].text == "誓师"
      # 缓冲造词
      - send: "{Control+b}jp mz  jpmz"
        assert: cand[1].text == "长猫"
  initial_pair_four_aux:
    tests:
      - send: yx
        assert: has("也许") and pair_comment("也许"):find("〔调笔₂₂₁₁ uo〕", 1, true)
      - send: yxu
        assert: has("也许") and pair_comment("也许"):find("〔调笔₂₂₁₁ ou〕", 1, true)
      - send: yxuo
        assert: has("也许") and pair_comment("也许"):find("〔调笔₂₂₁₁ ua〕", 1, true)
      - send: yxuou
        assert: has("也许") and pair_comment("也许"):find("〔调笔₂₂₁₁ a〕", 1, true)
      - send: yxuoua
        assert: has("也许") and not pair_comment("也许"):find("〔调笔₂₂₁₁", 1, true) and commit == nil
      - send: yxuoua{BackSpace}
        assert: has("也许") and pair_comment("也许"):find("〔调笔₂₂₁₁ a〕", 1, true)
  initial_pair_reverse_policy:
    patch:
      translator/word_auxiliary_order: "21"
    tests:
      - send: yx
        assert: has("也许") and pair_comment("也许"):find("〔调笔₁₁₂₂ ua〕", 1, true)
      - send: yxuauo
        assert: has("也许") and commit == nil
  initial_pair_learning:
    tests:
      # 先证明确实需要学习，再从四辅全码上屏，确认下一次短辅码首选前移。
      - send: yxi
        assert: (cand[1].text ~= "也需") or error(pair_probe())
      - send: yxivua
        assert: (cand[1].text == "也需") or error(pair_probe())
      - send: "yxivua yxi"
        assert: (cand[1].text == "也需") or error(pair_probe())
