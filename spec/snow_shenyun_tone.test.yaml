schema: snow_shenyun_tone
source_dir: ..
script: |
  function rank(text)
    for index, candidate in ipairs(cand) do
      if candidate.text == text then return index end
    end
    return math.huge
  end
  function has(text)
    return rank(text) < math.huge
  end
  function page(text)
    return rank(text) <= 6
  end
  function hint_codes()
    local codes = {}
    for index = 2, #cand do
      if not cand[index].comment:match("^[a-z][a-z]$") then break end
      codes[#codes + 1] = cand[index].comment
    end
    return table.concat(codes, " ")
  end
  function comment(text)
    for _, candidate in ipairs(cand) do
      if candidate.text == text then return candidate.comment end
    end
    return ""
  end
  function all_have_length(length)
    if #cand == 0 then return false end
    for _, candidate in ipairs(cand) do
      if utf8.len(candidate.text) ~= length then return false end
    end
    return true
  end
  function page_length_count(length)
    local count = 0
    for index = 1, math.min(6, #cand) do
      if utf8.len(cand[index].text) == length then count = count + 1 end
    end
    return count
  end
  function pair_comment(text)
    for _, candidate in ipairs(cand) do
      if candidate.text == text then return candidate.comment end
    end
    return ""
  end
  function pair_probe()
    local parts = { "preedit=" .. tostring(preedit), "commit=" .. tostring(commit) }
    for index = 1, math.min(16, #cand) do
      parts[#parts + 1] = tostring(index) .. ":" .. cand[index].text .. "/" .. cand[index].comment
    end
    return table.concat(parts, " | ")
  end
deploy:
  reverse_lookup:
    tests:
      # 部件全拼与笔画反查共用 u 入口，候选同时显示拼音。
      - send: "uwangyan"
        assert: page("琰") and cand[rank("琰")].comment:find("yan3", 1, true) ~= nil and commit == nil
      - send: "umaowenniao"
        assert: page("鹜") and cand[rank("鹜")].comment:find("wu4", 1, true) ~= nil and commit == nil
      # 单引号结束反查后可正常上屏，退格重输仍留在反查段。
      - send: "uwangyan' "
        assert: commit == "琰"
      - send: "uwangyan{BackSpace}n"
        assert: page("琰") and commit == nil
      # 共用入口不得破坏原有笔画反查。
      - send: ueiuoa
        assert: cand[1].text == "札"
  cross_route_user_phrase:
    tests:
      # 先证明空用户库中的短码首选不是“方案选单”，避免测试在未发生学习时假阳性。
      - send: fyyd
        assert: cand[1].text ~= "方案选单"
      # 用完整调辅码学习“方案选单”，动态码长随后会把它迁入四码短码并升为首选。
      - send: "fyydiu fyyd"
        assert: cand[1].text == "方案选单"
  buffered_command:
    tests:
      - send: o
        assert: cand[1].text == "📝 开启缓冲" and commit == nil
      - send: "o o"
        assert: cand[1].text == "📝 关闭缓冲" and commit == nil
      - send: "o o "
        assert: commit == nil and preedit == nil
  popping:
    tests:
      # UM40：qz 为空桶，zq 编码 zen，不得错误回收为声声词。
      - send: qz
        assert: all_have_length(2)
      - send: zq
        assert: cand[1].text == "怎" and all_have_length(1)
      # 每个声声空桶只取首选词；七个桶按词频排列，随后按字频接单字。
      - send: w
        assert: cand[1].text == "这" and hint_codes() == "wx ws wd wf wc wv wb" and cand[2].text == "支持" and cand[8].text == "这边" and cand[9].text == "中" and cand[10].text == "着" and cand[11].text == "真" and cand[12].text == "只" and cand[13].text == "找" and cand[9].comment:find("〔声韵 wr〕", 1, true)
      # v 是声母；普通声韵桶 ve/vi 不得混入空桶提示。
      - send: v
        assert: cand[1].text == "是" and hint_codes() == "vv vs vr vd vx vb vf"
      # wf 的提示须与声声桶本身的首选一致；wr 有单字，不显示空桶提示。
      - send: wf
        assert: cand[1].text == "之前"
      - send: wr
        assert: cand[1].text == "中" and all_have_length(1)
      # 输入统计沿用公共 lua 前缀 o。
      - send: otj
        assert: cand[1].text == "📖 统计功能说明" and cand[2].text:match("^📊 ") ~= nil
      # UM40-ac9707a932d1 换位后的一级固顶字。
      - send: d
        assert: cand[1].text == "都" and cand[1].comment:find("📌", 1, true) and not cand[2].comment:find("📌", 1, true)
      - send: p
        assert: cand[1].text == "平"
      - send: j
        assert: cand[1].text == "我"
      # 占用桶保留汉字首选，字母固定为大写第 2、小写第 3。
      - send: bn
        assert: cand[1].text == "帮" and cand[2].text == "B" and cand[3].text == "b"
      # 单字定字：[ 重复该字，] 在该字后追加“得”
      - send: "j["
        assert: commit == "我我"
      - send: "j]"
        assert: commit == "我得"
      - send: r
        assert: cand[1].text == "人"
      - send: z
        assert: cand[1].text == "在"
      # 合法 AU 不得混入同键位的声声二字词。
      - send: be
        assert: all_have_length(1) and has("冰") and comment("冰"):find("〔调 io〕", 1, true) and preedit == "be"
      # 冰 bing1 首 B=i（阴平），后续的 o/e 为前两笔（丶一）；调码归音节，笔画另入括号。
      - send: bei
        assert: has("冰") and comment("冰"):find("〔调 oe〕", 1, true) and preedit == "bei"
      - send: beio
        assert: has("冰") and comment("冰"):find("〔调 ei〕", 1, true) and preedit == "bei 笔[o]"
      # 四码顶的 AU→AUA 中间态不得把「测」顶屏；chvi 为「测试」。
      - send: chvi
        assert: commit == nil and has("测试") and preedit == "ch vi"
      - send: chvia
        assert: has("测试") and preedit == "cha vi"
      - send: chviaa
        assert: has("测试") and preedit == "cha via"
      # AU 空桶回退为声声二字词；按标准二字词辅序反向，先用第二字声调、首笔画筛选。
      - send: cv
        assert: all_have_length(2) and has("测试")
      # gi 是空 AB，不能解释为声声二字词；继续输入辅键形成的 AUB 也暂时保留为空。
      - send: gi
        assert: "#cand == 0 and commit == nil"
      - send: gia
        assert: "#cand == 0 and commit == nil"
      - send: cva
        assert: has("测试") and not has("措施") and not has("财神")
      - send: cve
        assert: has("财神") and not has("才是") and not has("测试")
      # 各级主码候选均随新声韵映射重算：AUAU、AAA、AAAU、AAAA。
      - send: beyb
        assert: has("冰雪")
      - send: vrf
        assert: has("输入法")
      - send: vrfa
        assert: has("输入法")
      - send: rgwn
        assert: has("人工智能")
      # sysp 同时容纳「由于」「优先于」「婴儿用品」等候选；跨词长分层排序，首页各取两个二、三、四字词。
      - send: sysp
        assert: page_length_count(2) == 2 and page_length_count(3) == 2 and page_length_count(4) == 2
      - send: fyydiu
        assert: cand[1].text == "方案选单"
      # cvsy 可走 AAAA 得到「测试一下」，不得误入「测试仪」的三字词入口。
      - send: cvsy
        assert: has("测试一下") and not has("测试仪")
      # si 是 yi 的合法完整音节，cvsi 应走 AAAU 得到三字词。
      - send: cvsi
        assert: all_have_length(3) and has("测试仪")
      # yr 是合法的 xia 音节；dsyri 走标准 AAAU+B2，调辅给出第二字一声。
      - send: dsyri
        assert: has("等一下")
      # ;/ 与 21×21 方案一致：顶出当前候选后追加“的/了”。
      - send: chvi;
        assert: commit == "测试的"
      - send: chvi/
        assert: commit == "测试了"
      # 第三音节 yi 的 si 占用桶使用完整 AAAU 主码，sksiu 是标准 AAAU+B 调辅码。
      - send: sksiu
        assert: has("也可以")
      - send: beioe
        assert: has("冰")
      # 部首冫的三拼部首码以 b 开头；数字 1 与声调、笔画互不混淆。
      - send: "bei1b"
        assert: has("冰")
      - send: "bei1x"
        assert: not has("冰")
  initial_hint_selection:
    tests:
      - send: "w2"
        assert: commit == "支持"
      - send: "w{Page_Down} "
        assert: commit == "这时"
  initial_pair_four_aux:
    tests:
      - send: cv
        assert: has("才是") and pair_comment("才是"):find("〔调笔₂₂₁₁ ai〕", 1, true)
      - send: cva
        assert: has("才是") and pair_comment("才是"):find("〔调笔₂₂₁₁ ie〕", 1, true)
      - send: cvai
        assert: has("才是") and pair_comment("才是"):find("〔调笔₂₂₁₁ ee〕", 1, true)
      - send: cvaie
        assert: has("才是") and pair_comment("才是"):find("〔调笔₂₂₁₁ e〕", 1, true)
      - send: cvaiee
        assert: has("才是") and not pair_comment("才是"):find("〔调笔₂₂₁₁", 1, true) and commit == nil
      - send: cvaiee{BackSpace}
        assert: has("才是") and pair_comment("才是"):find("〔调笔₂₂₁₁ e〕", 1, true)
  initial_pair_reverse_policy:
    patch:
      translator/word_auxiliary_order: "21"
    tests:
      - send: cv
        assert: has("才是") and pair_comment("才是"):find("〔调笔₁₁₂₂ ee〕", 1, true)
      - send: cveeai
        assert: has("才是") and commit == nil
  initial_pair_learning:
    tests:
      # 先证明确实需要学习，再从四辅全码上屏，确认下一次短辅码首选前移。
      - send: cva
        assert: (cand[1].text ~= "才是") or error(pair_probe())
      - send: cvaiee
        assert: (cand[2].text == "才是") or error(pair_probe())
      - send: "cvaiee2cva"
        assert: (cand[1].text == "才是") or error(pair_probe())
