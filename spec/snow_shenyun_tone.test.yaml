schema: snow_shenyun_tone
source_dir: ..
script: |
  function rank(text)
    for index, candidate in ipairs(cand) do
      if candidate.text == text then return index end
    end
    return math.huge
  end
  function has(text)
    return rank(text) < math.huge
  end
  function page(text)
    return rank(text) <= 6
  end
  function comment(text)
    for _, candidate in ipairs(cand) do
      if candidate.text == text then return candidate.comment end
    end
    return ""
  end
  function all_have_length(length)
    if #cand == 0 then return false end
    for _, candidate in ipairs(cand) do
      if utf8.len(candidate.text) ~= length then return false end
    end
    return true
  end
  function page_length_count(length)
    local count = 0
    for index = 1, math.min(6, #cand) do
      if utf8.len(cand[index].text) == length then count = count + 1 end
    end
    return count
  end
deploy:
  reverse_lookup:
    tests:
      # 部件全拼与笔画反查共用 u 入口，候选同时显示拼音。
      - send: "uwangyan"
        assert: page("琰") and cand[rank("琰")].comment:find("yan3", 1, true) ~= nil and commit == nil
      - send: "umaowenniao"
        assert: page("鹜") and cand[rank("鹜")].comment:find("wu4", 1, true) ~= nil and commit == nil
      # 单引号结束反查后可正常上屏，退格重输仍留在反查段。
      - send: "uwangyan' "
        assert: commit == "琰"
      - send: "uwangyan{BackSpace}n"
        assert: page("琰") and commit == nil
      # 共用入口不得破坏原有笔画反查。
      - send: ueiuoa
        assert: cand[1].text == "札"
  cross_route_user_phrase:
    tests:
      # 先证明空用户库中的短码首选不是“方案选单”，避免测试在未发生学习时假阳性。
      - send: fyyd
        assert: cand[1].text ~= "方案选单"
      # 用完整调辅码学习“方案选单”，动态码长随后会把它迁入四码短码并升为首选。
      - send: "fyydiu fyyd"
        assert: cand[1].text == "方案选单"
  buffered_command:
    tests:
      - send: o
        assert: cand[1].text == "📝 开启缓冲" and commit == nil
      - send: "o o"
        assert: cand[1].text == "📝 关闭缓冲" and commit == nil
      - send: "o o "
        assert: commit == nil and preedit == nil
  popping:
    tests:
      # 输入统计沿用公共 lua 前缀 o。
      - send: otj
        assert: cand[1].text == "📖 统计功能说明" and cand[2].text:match("^📊 ") ~= nil
      # D3/V1 换位后的一级固顶字。
      - send: d
        assert: cand[1].text == "都" and cand[1].comment:find("📌", 1, true) and not cand[2].comment:find("📌", 1, true)
      - send: p
        assert: cand[1].text == "平"
      - send: j
        assert: cand[1].text == "我"
      # 占用桶保留汉字首选，字母固定为大写第 2、小写第 3。
      - send: bn
        assert: cand[1].text == "帮" and cand[2].text == "B" and cand[3].text == "b"
      # 单字定字：[ 重复该字，] 在该字后追加“得”
      - send: "j["
        assert: commit == "我我"
      - send: "j]"
        assert: commit == "我得"
      - send: v
        assert: cand[1].text == "是"
      - send: r
        assert: cand[1].text == "人"
      - send: z
        assert: cand[1].text == "在"
      # 合法 AU 不得混入同键位的声声二字词。
      - send: bq
        assert: all_have_length(1) and has("冰") and comment("冰"):find("〔调 io〕", 1, true) and preedit == "bq"
      # 冰 bing1 首 B=i（阴平），后续的 o/e 为前两笔（丶一）；调码归音节，笔画另入括号。
      - send: bqi
        assert: has("冰") and comment("冰"):find("〔调 oe〕", 1, true) and preedit == "bqi"
      - send: bqio
        assert: has("冰") and comment("冰"):find("〔调 ei〕", 1, true) and preedit == "bqi 笔[o]"
      # 四码顶的 AU→AUA 中间态不得把「测」顶屏；chvi 为「测试」。
      - send: chvi
        assert: commit == nil and has("测试") and preedit == "ch vi"
      - send: chvia
        assert: has("测试") and preedit == "cha vi"
      - send: chviaa
        assert: has("测试") and preedit == "cha via"
      # AU 空桶回退为声声二字词；第三码按第一字声调筛选。
      - send: cv
        assert: all_have_length(2) and has("测试")
      # gi 是空 AB，不能解释为声声二字词；继续输入辅键形成的 AUB 也暂时保留为空。
      - send: gi
        assert: "#cand == 0 and commit == nil"
      - send: gia
        assert: "#cand == 0 and commit == nil"
      - send: cva
        assert: has("测试") and has("措施") and not has("财神")
      - send: cve
        assert: has("财神") and has("才是") and not has("测试")
      # 各级主码候选均随新声韵映射重算：AUAU、AAA、AAAU、AAAA。
      - send: bqyt
        assert: has("冰雪")
      - send: vrf
        assert: has("输入法")
      - send: vrfa
        assert: has("输入法")
      - send: rgsn
        assert: has("人工智能")
      # 同一四码桶跨词长分层排序，第一页在候选充足时各取两个二、三、四字词。
      - send: jxxd
        assert: page_length_count(2) == 2 and page_length_count(3) == 2 and page_length_count(4) == 2
      - send: fyydiu
        assert: cand[1].text == "方案选单"
      # cv、wy 都不是合法音节；cvwy 只能走 AAAA，不能混入二、三字前缀候选。
      - send: cvwy
        assert: has("测试一下") and not has("测试仪")
      # wi 是合法完整音节，cvwi 仍应走 AAAU 得到三字词。
      - send: cvwi
        assert: all_have_length(3) and has("测试仪")
      # yr 是合法的 xia 音节；dwyri 走标准 AAAU+B2，调辅给出第二字一声。
      - send: dwyri
        assert: has("等一下")
      # ;/ 与 21×21 方案一致：顶出当前候选后追加“的/了”。
      - send: chvi;
        assert: commit == "测试的"
      - send: chvi/
        assert: commit == "测试了"
      # 第三音节的 yu 空桶可把第二字三声辅键 u 前移，ykyu 是 AAA+B 的可选短码。
      - send: wkwiu
        assert: has("也可以")
      - send: bqioe
        assert: has("冰")
      # 部首冫的三拼部首码以 b 开头；数字 1 与声调、笔画互不混淆。
      - send: "bqi1b"
        assert: has("冰")
      - send: "bqi1x"
        assert: not has("冰")
