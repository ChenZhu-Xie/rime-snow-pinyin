schema: snow_shenyun
source_dir: ..
script: |
  function has(something)
    for _, v in ipairs(cand) do
      if v.text == something then
        return true
      end
    end
    return false
  end
deploy:
  default:
    tests:
      # 连续输入按每音节两键切分，并使用冰雪拼音的全部词库。
      - send: bdxypgyg
        assert: has("冰雪拼音")
      - send: nwym
        assert: has("那样")
      - send: qfqj
        assert: has("偶尔")
      # R9 的普通声母、零声母及碰撞韵母代表码。
      - send: fm
        assert: has("张")
      - send: jr
        assert: has("居")
      - send: bq
        assert: has("本")
      - send: be
        assert: has("波")
      - send: jq
        assert: has("军")
      - send: yq
        assert: has("云")
