schema: snow_jiandao
source_dir: ..
script: |
  function has(something)
    for _, v in ipairs(cand) do
      if v.text == something then
        return true
      end
    end
    return false
  end
  function eq(left, right)
    print("Left  = " .. tostring(left))
    print("Right = " .. tostring(right))
    return left == right
  end
deploy:
  sentence:
    patch:
      'switches/@4/reset': 0
    tests:
      - send: bkxhpdfd
        assert: cand[1].text == "冰雪拼音"
  popping:
    tests:
      # 组词规则
      - send: bkxh
        assert: has("冰雪")
      - send: yrf
        assert: has("输入法")
      - send: wmxj
        assert: has("充满希望")
      # 编码导航：14567 直达字位；U/P 物理循环，I/O 逻辑左/右循环
      - send: "wmxj1{BackSpace}"
        assert: eq(preedit, "m x j")
      - send: "wmxj4{BackSpace}"
        assert: eq(preedit, "wxj")
      - send: "wmxj5{BackSpace}"
        assert: eq(preedit, "wmj")
      - send: "wmxj6{BackSpace}"
        assert: eq(preedit, "w m x")
      - send: "wmxj7{BackSpace}"
        assert: eq(preedit, "w m x")
      - send: "wmxj{Control+u}{BackSpace}"
        assert: eq(preedit, "wmj")
      - send: "wmxj1{Control+i}{BackSpace}"
        assert: eq(preedit, "w m x")
      - send: "wmxj1{Control+o}{BackSpace}"
        assert: eq(preedit, "wxj")
      - send: "wmxj1{Control+u}{BackSpace}"
        assert: eq(preedit, "w m x")
      - send: "wmxj{Control+p}{Control+p}{BackSpace}"
        assert: eq(preedit, "m x j")
      - send: ejyrF
        assert: has("中文输入法")
      - send: ehrmGHG
        assert: has("中华人民共和国")
      # 固顶词
      - send: p
        assert: cand[1].text == "平"
      - send: xh
        assert: cand[1].text == "学"
      - send: bkov
        assert: cand[1].text == "冰"
      - send: bf
        assert: cand[1].text == "不要"
      - send: ee
        assert: cand[1].text == "这种" and not has("(zhei4)")
      - send: se
        assert: cand[1].text == "随着" and not has("(sei1)")
      - send: seu
        assert: not has("(sei3)")
      - send: ge
        assert: cand[1].text == "给"
      - send: we
        assert: not has("(chei1)") and not has("(chei2)") and not has("(chei3)") and not has("(chei4)")
      - send: sd
        assert: not has("四但")
      - send: rc
        assert: not has("人从")
      - send: fu
        assert: cand[1].text == "以及"
      - send: ho
        assert: cand[1].text == "好吧"
      - send: xo
        assert: cand[1].text == "行吧"
      - send: xou
        assert: cand[1].text == "行叭"
      - send: fpgs
        assert: cand[1].text == "一个"
      - send: nnfq
        assert: cand[1].text == "那样"
      - send: jprlT
        assert: cand[1].text == "键盘热力图"
      # 首选后置
      - send: ypyp
        assert: cand[1].text == "事实"
      - send: ypypv
        assert: cand[2].text == "事实"
      # 顶功
      - send: fpgsfpgs
        assert: commit == "一个" and cand[1].text == "一个"
      - send: bkovxhv
        assert: commit == "冰" and cand[1].text == "雪"
      - send: pdfdyrf
        assert: commit == "拼音" and cand[1].text == "输入法"
      # 强制上屏尾字；原 d/l 一码仍然保留
      - send: fpgs;
        assert: commit == "一个的"
      - send: fpgs/
        assert: commit == "一个了"
      - send: d
        assert: cand[1].text == "的"
      - send: l
        assert: cand[1].text == "了"
      # 大写结构略码；四码后的大写仍由原顶功编码处理
      - send: kuoK
        assert: commit == "可爱了一可爱"
      - send: koaP
        assert: commit == "开不开心"
      - send: koaJ
        assert: commit == "开了开心"
      - send: koaN
        assert: commit == "开里开心"
      - send: koaG
        assert: commit == "开个心"
      - send: kuoE
        assert: commit == "可可爱"
      - send: kuoT
        assert: commit == "爱可爱"
      - send: kuoY
        assert: commit == "可爱可"
      - send: kuoI
        assert: commit == "可爱爱"
      - send: bfA
        assert: commit == "不要不要"
      # 动态码长
      - send: "ypypiiypyp"
        assert: cand[1].text == "誓师"
      # 缓冲造词
      - send: "vwq myua  wqmy"
        assert: cand[1].text == "长猫"
