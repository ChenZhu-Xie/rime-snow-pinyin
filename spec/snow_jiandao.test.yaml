schema: snow_jiandao
source_dir: ..
script: |
  function rank(something)
    for i, v in ipairs(cand) do
      if v.text == something then return i end
    end
    return math.huge
  end
  function has(something)
    return rank(something) < math.huge
  end
  function page(something)
    return rank(something) <= 6
  end
  function pinned(index)
    return cand[index] ~= nil and cand[index].comment:find("📌") ~= nil
  end
  function eq(left, right)
    print("Left  = " .. tostring(left))
    print("Right = " .. tostring(right))
    return left == right
  end
deploy:
  sentence:
    patch:
      'switches/@4/reset': 0
    tests:
      - send: bdxypgyg
        assert: cand[1].text == "冰雪拼音"
  popping:
    tests:
      # r5 不应占用单键 r，仍能查询其他 r 声母的字
      - send: r
        assert: page("人") and has("日")
      # r5 并入 er5 后，原有字仍可按儿输入
      - send: xj
        assert: has("兒")
      # 组词规则
      - send: bdxy
        assert: has("冰雪")
      - send: erf
        assert: has("输入法")
      - send: wmxj
        assert: has("充满希望")
      # 编码导航：14567 直达字位；Y/O 物理循环，U/I 逻辑左/右循环
      - send: "wmxj1{BackSpace}"
        assert: eq(preedit, "m x j")
      - send: "wmxj4{BackSpace}"
        assert: eq(preedit, "wxj")
      - send: "wmxj5{BackSpace}"
        assert: eq(preedit, "wmj")
      - send: "wmxj6{BackSpace}"
        assert: eq(preedit, "w m x")
      - send: "wmxj7{BackSpace}"
        assert: eq(preedit, "w m x")
      - send: "wmxj{Control+y}{BackSpace}"
        assert: eq(preedit, "wmj")
      - send: "wmxj1{Control+u}{BackSpace}"
        assert: eq(preedit, "w m x")
      - send: "wmxj1{Control+i}{BackSpace}"
        assert: eq(preedit, "wxj")
      - send: "wmxj1{Control+y}{Control+y}{Control+y}{BackSpace}"
        assert: eq(preedit, "wmj")
      - send: "wmxj{Control+o}{Control+o}{BackSpace}"
        assert: eq(preedit, "m x j")
      - send: fjerF
        assert: has("中文输入法")
      - send: fhrmGHG
        assert: has("中华人民共和国")
      # 固顶词
      - send: p
        assert: cand[1].text == "平"
      - send: xy
        assert: cand[1].text == "学"
      - send: bdov
        assert: cand[1].text == "冰"
      - send: by
        assert: cand[1].text == "不要"
      - send: fx
        assert: cand[1].text == "飞" and not has("(zhei4)")
      - send: fuv
        assert: cand[1].text == "这种"
      - send: sx
        assert: cand[1].text == "思想" and not has("(sei1)")
      - send: sxu
        assert: not has("(sei3)")
      - send: gx
        assert: cand[1].text == "给"
      # 辅音字母使用共享 c 列；三拼在同一基码后追加轻声键 o。
      - send: gc
        assert: cand[1].text == "挂" and has("G") and has("g")
      - send: ge
        assert: not has("G") and not has("g")
      # 元音字母使用共享 x 载体；O 的二键基码为 xe。
      - send: xe
        assert: has("O") and has("o")
      - send: qq
        assert: not has("O") and not has("o")
      # 上游新增的字母和数字候选按当前声韵映射落在原有固顶码后。
      - send: bc
        assert: cand[1].text == "表" and cand[2].text == "B" and cand[3].text == "b"
      - send: xy
        assert: cand[1].text == "学" and cand[2].text == "V" and cand[3].text == "v"
      - send: qj
        assert: cand[1].text == "二" and cand[2].text == "2"
      - send: xj
        assert: cand[1].text == "希望" and cand[2].text == "U" and cand[3].text == "u"
      - send: ski
        assert: cand[1].text == "四" and cand[2].text == "4"
      - send: wx
        assert: not has("(chei1)") and not has("(chei2)") and not has("(chei3)") and not has("(chei4)")
      - send: sd
        assert: not has("四但")
      - send: rc
        assert: not has("人从")
      - send: yj
        assert: cand[1].text == "以及"
      - send: hb
        assert: cand[1].text == "好吧"
      - send: xo
        assert: cand[1].text == "行吧"
      - send: xou
        assert: cand[1].text == "行叭"
      - send: ykgs
        assert: cand[1].text == "一个"
      # 以词定字：[ 取词首，] 取词尾
      - send: "ykgs["
        assert: commit == "一"
      - send: "ykgs]"
        assert: commit == "个"
      - send: nwym
        assert: cand[1].text == "那样"
      # 首选后置
      - send: ekek
        assert: cand[1].text == "事实"
      - send: ekekv
        assert: cand[2].text == "事实"
      # 顶功
      - send: ykgsykgs
        assert: commit == "一个" and cand[1].text == "一个"
      - send: bdovxyv
        assert: commit == "冰" and cand[1].text == "雪"
      - send: pgygerf
        assert: commit == "拼音" and cand[1].text == "输入法"
      # 强制上屏尾字；原 d/l 一码仍然保留
      - send: ykgs;
        assert: commit == "一个的"
      - send: ykgs/
        assert: commit == "一个了"
      - send: d
        assert: cand[1].text == "的"
      - send: l
        assert: cand[1].text == "了"
      # 大写结构略码；四码后的大写仍由原顶功编码处理
      - send: kuoK
        assert: commit == "可爱了一可爱"
      - send: koaP
        assert: commit == "开不开心"
      - send: koaJ
        assert: commit == "开了开心"
      - send: koaN
        assert: commit == "开里开心"
      - send: koaG
        assert: commit == "开个心"
      - send: kuoE
        assert: commit == "可可爱"
      - send: kuoT
        assert: commit == "爱可爱"
      - send: kuoY
        assert: commit == "可爱可"
      - send: kuoI
        assert: commit == "可爱爱"
      - send: byA
        assert: commit == "不要不要"
      # 动态码长
      - send: "ekekiiekek"
        assert: cand[1].text == "誓师"
      # 缓冲造词
      - send: "vwm mzu  wmmz"
        assert: cand[1].text == "长猫"
      - send: "{Control+period}bdxyerf  bxerF"
        assert: cand[1].text == "冰雪输入法"
      # 本地键道使用 jjv/gc/tp/xg；数字和字母取第二候选。
      - send: "{Control+period}jjv2gc2tpxg  jgtx"
        assert: cand[1].text == "5G通信"
      # 键道和三拼的元音字母简拼都使用共享载体 x。
      - send: "{Control+period}dyou lwo xw mn  dlxm"
        assert: cand[1].text == "哆啦A梦"
  # 高级功能
  advanced:
    tests:
      # 拼音反查（`a` 引导）
      - send: ashi
        assert: cand[1].text == "是"
      # 键道笔画顺序为横竖撇点折 → viuoa。
      - send: uviuoa
        assert: cand[1].text == "札"
      # 重复上屏（`i` 引导）
      - send: "wpfj i"
        assert: cand[1].text == "重复"
      # 符号（`i` 引导）
      - send: ia
        assert: cand[1].text == "ā"
      # Lua 脚本：数字转中文数字
      - send: o123
        assert: cand[1].text == "一百二十三" and has("壹佰贰拾叁")
      # Unicode 码点
      - send: o4e00
        assert: cand[1].text == "一"
      # Lua 脚本：计算表达式
      - send: o1234*5678
        assert: has("7006652")
      # Lua 脚本：日期与时间（只检查格式）
      - send: orq
        assert: cand[1].text:match("^%d+年%d+月%d+日$") ~= nil
      - send: osj
        assert: cand[1].text:match("^%d+时%d+分%d+秒$") ~= nil
      - send: ors
        assert: cand[1].text:match("^%d+年%d+月%d+日%d+时%d+分%d+秒$") ~= nil
      # 以词定字：`[` 取首字、`]` 取末字
      - send: "xkrm["
        assert: commit == "熙"
      # 词不在首选时先用方向键选中再定字
      - send: "jpdz{Down}]"
        assert: commit == "刀"
  # 方案码用户词典：这些操作会写入 snow_jiandao.userdb，故单独部署并按顺序执行
  schema_userdb:
    tests:
      # 固定：本地固定键为 Control+,，编码/剪刀使用当前神韵码。
      - send: bpmw
        assert: not pinned(1)
      - send: "bpmw{Control+comma}bpmw"
        assert: cand[1].text == "编码" and pinned(1)
      - send: "bpmw{Control+comma}bpmw"
        assert: not pinned(1)
      # 自由加词：Control+' → 任意方式输入 → Control+'
      # 无编码时的大写字母、数字由应用直接插入，不经 Rime 上屏，也要记进新词
      - send: "kfc{Control+apostrophe}fkxqS Vj 50{Control+apostrophe}kfc"
        assert: cand[1].text == "疯狂星期四V我50"
      # 本地 hb 固顶好吧：新词不得挤掉已有首选。
      - send: "hb{Control+apostrophe}ljhe v{Control+apostrophe}hb"
        assert: cand[1].text == "好吧" and cand[2].text == "垃圾回收"
      - send: "jpdz{Control+comma}{Down}{Control+comma}{Up}"
        assert: cand[1].text == "见到" and cand[2].text == "剪刀"
      - send: "jpdz{Control+bracketright}jpdz"
        assert: cand[1].text == "剪刀" and cand[2].text == "见到"
      - send: "jpdz{Down}{Control+bracketleft}jpdz"
        assert: cand[1].text == "见到" and cand[2].text == "剪刀"
      - send: "jpdz{Control+backslash}jpdz"
        assert: not pinned(1) and not pinned(2)
  shape_g:
    patch:
      translator/shape_sources: [G]
    tests:
      - send: "uuooao"
        assert: has("令")
      - send: "uuovao"
        assert: not has("令")
  shape_t:
    patch:
      translator/shape_sources: [T]
    tests:
      - send: "uuovao"
        assert: has("令")
      - send: "uuooao"
        assert: not has("令")
