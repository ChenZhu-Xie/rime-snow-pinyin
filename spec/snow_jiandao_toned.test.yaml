schema: snow_jiandao_toned
source_dir: ..
script: |
  function rank(text)
    for index, candidate in ipairs(cand) do
      if candidate.text == text then return index end
    end
    return math.huge
  end
  function has(text)
    return rank(text) < math.huge
  end
  function comment(text)
    for _, candidate in ipairs(cand) do
      if candidate.text == text then return candidate.comment end
    end
    return ""
  end
  function probe()
    local parts = { "preedit=" .. tostring(preedit), "commit=" .. tostring(commit) }
    for index = 1, math.min(12, #cand) do
      parts[#parts + 1] = index .. ":" .. cand[index].text .. "/" .. cand[index].comment
    end
    return table.concat(parts, " | ")
  end
deploy:
  popping:
    tests:
      # 冷态三字简拼不能借用其他查询留下的已学习／候选状态。
      - send: xkd
        assert: cand[1].text == "形式的" and rank("新时代") > 1 and commit == nil
      - send: xkdY
        assert: cand[1].text == "新时代" and commit == nil
      # CR-REF 的音节和纯形辅：冰 bz、雪 xd、拼 pn；QZ 已改为 qiang1。
      - send: bz
        assert: has("冰")
      - send: xd
        assert: cand[1].text == "写" and cand[2].text == "O" and cand[3].text == "o"
      - send: pn
        assert: cand[1].text == "哭" and has("拼")
      - send: qx
        assert: cand[1].text == "掐"
      - send: qm
        assert: has("秋")
      - send: qz
        assert: has("枪") and not has("掐") and not has("秋")
      - send: bzxd
        assert: cand[1].text == "冰雪" or error(probe())
      # 二字 21：雪首辅 v、冰首辅 o，六字母后不能再追加形辅。
      - send: bzxdvo
        assert: (cand[1].text == "冰鞋" and cand[2].text == "冰雪") or error(probe())
      - send: bzxdvoa
        assert: (cand[1].text == "冰鞋" and cand[2].text == "冰雪" and not preedit:find("voa", 1, true)) or error(probe())
      # 三字 231：入 u、法 a、输 v；四字 14：人 i、能 a。
      - send: krfuav
        assert: cand[1].text == "输入法"
      - send: rgenia
        assert: cand[1].text == "人工智能"
      # 单字最多追加四辅，雪的实际形码为 voav。
      - send: xdvoav
        assert: has("雪")
      - send: xdvoava
        assert: has("雪") and not preedit:find("voava", 1, true)
      # 630 按新声母重映射兰道；每类固顶仅选一例。
      - send: ba
        assert: cand[1].text == "不能"
      - send: d
        assert: cand[1].text == "都"
  initial_pair:
    tests:
      # rf 在当前系统词典的运行时口径中为空，标准 21 的反序是 12。
      # 软 va、饭 ua；热 i、敷 v，第一辅即可排除另一条路径。
      - send: rf
        assert: has("软饭") and has("热敷")
      - send: rfv
        assert: has("软饭") and not has("热敷") and comment("软饭"):find("形₁₁₂₂", 1, true) ~= nil
      - send: rfva
        assert: has("软饭")
      - send: rfvau
        assert: has("软饭")
      - send: rfvaua
        assert: (cand[1].text == "软风" and cand[2].text == "软饭") or error(probe())
      - send: rfvauao
        assert: (cand[1].text == "软风" and cand[2].text == "软饭" and not preedit:find("vauao", 1, true)) or error(probe())
      # kg 有本地大字集异读「杓 shuo2」，不可作为声声空桶。
      - send: kg
        assert: cand[1].text == "杓" and not has("说过") or error(probe())
      - send: kgv
        assert: has("杓") and not has("说过") or error(probe())
      # 固顶二简词也走反序两辅；成 vu、功 vi。
      - send: sg
        assert: cand[1].text == "成功" or error(probe())
      - send: sgv
        assert: has("成功") or error(probe())
      - send: sgvu
        assert: has("成功") or error(probe())
      - send: sgvuv
        assert: has("成功") or error(probe())
      - send: sgvuvi
        assert: (cand[1].text == "厨工" and cand[2].text == "成功") or error(probe())
      # hf 空桶同时容纳回复和合法，按第一字的形辅区分。
      - send: hfi
        assert: has("合法")
      - send: hfo
        assert: not has("合法")
  mixed_spelling:
    tests:
      # 大写第二码补韵继续沿用兰道；三字简拼留在 abc 段。
      - send: kNrPfS
        assert: has("输入法")
  top:
    tests:
      # 二字词四码顶、三字词加辅后顶、单字加辅后顶。
      - send: bzxdpn
        assert: commit == "冰雪" and has("扑")
      - send: bzxdvobzxdvo
        assert: commit == "冰雪" and cand[1].text == "冰雪"
      - send: krfuavbzxdvo
        assert: commit == "输入法" and cand[1].text == "冰雪"
      - send: xdvpn
        assert: commit == "雪" and cand[1].text == "哭"
      - send: bzxdvo;
        assert: commit == "冰雪的"
      - send: bzxdvo/
        assert: commit == "冰雪了"
  buffered:
    tests:
      # 目标已在首选时停止补辅，避免把后置后的新首选学进用户词典。
      - send: "o bzxdkrf  bxkrF"
        assert: (cand[1] ~= nil and cand[1].text == "冰雪输入法") or error(probe())
  advanced:
    tests:
      - send: ashi
        assert: cand[1].text == "是"
      - send: uviuoa
        assert: cand[1].text == "札"
