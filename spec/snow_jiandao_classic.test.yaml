schema: snow_jiandao_classic
source_dir: ..
script: |
  function has(something)
    for _, v in ipairs(cand) do
      if v.text == something then
        return true
      end
    end
    return false
  end
  function pair_comment(text)
    for _, candidate in ipairs(cand) do
      if candidate.text == text then return candidate.comment end
    end
    return ""
  end
  function pair_probe()
    local parts = { "preedit=" .. tostring(preedit), "commit=" .. tostring(commit) }
    for index = 1, math.min(16, #cand) do
      parts[#parts + 1] = tostring(index) .. ":" .. cand[index].text .. "/" .. cand[index].comment
    end
    return table.concat(parts, " | ")
  end
deploy:
  entry_contract:
    tests:
      # 生僻字补桶须为真实词典候选，不能只由 fixed 兜底造出同名候选。
      - send: jeo
        assert: cand[1].text == "㬚" and cand[1].comment:find("📌", 1, true)
  traditional_entry_contract:
    options:
      traditionalization: true
    tests:
      - send: l
        assert: cand[1].text == "來"
  sentence:
    patch:
      'switches/@4/reset': 0
    tests:
      - send: bgxhpbyb
        assert: cand[1].text == "冰雪拼音"
  popping:
    tests:
      # 组词规则
      - send: bgxh
        assert: has("冰雪")
      - send: erf
        assert: has("输入法")
      - send: wmxw
        assert: has("充满希望")
      - send: fwerF
        assert: has("中文输入法")
      - send: fhrmGHG
        assert: has("中华人民共和国")
      # 后续版本迁入：三字及以上简拼的前三字可用大写韵键补全。
      - send: eJrf
        assert: has("输入法")
      - send: erJf
        assert: has("输入法")
      - send: erfS
        assert: has("输入法")
      - send: eJrJfS
        assert: has("输入法")
      - send: zKxGwE
        assert: has("自行车")
      # 固顶词
      - send: d
        assert: cand[1].text == "都"
      - send: p
        assert: cand[1].text == "跑"
      # 单字定字：[ 重复该字，] 在该字后追加“得”
      - send: "p["
        assert: commit == "跑跑"
      - send: "p]"
        assert: commit == "跑得"
      - send: xh
        assert: cand[1].text == "学"
      - send: bgov
        assert: cand[1].text == "冰"
      - send: be
        assert: cand[1].text == "不是"
      - send: yi
        assert: cand[1].text == "一个"
      # 字母与冰雪三拼共享二键基码；保留原汉字首选，大写、小写随后。
      - send: bc
        assert: cand[1].text == "表" and cand[2].text == "B" and cand[3].text == "b"
      - send: xg
        assert: cand[1].text == "行" and cand[2].text == "V" and cand[3].text == "v"
      # 阿拉伯数字紧跟对应汉字数字，不覆盖原有首选。
      - send: xj
        assert: cand[1].text == "二" and cand[2].text == "2"
      - send: qkv
        assert: cand[1].text == "七" and cand[2].text == "7"
      - send: lgv
        assert: cand[1].text == "零" and cand[2].text == "0"
      # 首选后置
      - send: ekek
        assert: cand[1].text == "事实"
      - send: ekekv
        assert: cand[2].text == "事实"
      # 顶功
      - send: yiyi
        assert: commit == "一个" and cand[1].text == "一个"
      - send: bgovxhv
        assert: commit == "冰" and cand[1].text == "雪"
      - send: pbyberf
        assert: commit == "拼音" and cand[1].text == "输入法"
      # 动态码长
      - send: "ekekiiekek"
        assert: cand[1].text == "誓师"
      # 缓冲造词
      - send: "{Control+b}jp mz  jpmz"
        assert: cand[1].text == "长猫"
  initial_pair_four_aux:
    tests:
      - send: yx
        assert: has("也许") and pair_comment("也许"):find("〔形₂₂₁₁ oa〕", 1, true)
      - send: yxo
        assert: has("也许") and pair_comment("也许"):find("〔形₂₂₁₁ aa〕", 1, true)
      - send: yxoa
        assert: has("也许") and pair_comment("也许"):find("〔形₂₂₁₁ ai〕", 1, true)
      - send: yxoaa
        assert: has("也许") and pair_comment("也许"):find("〔形₂₂₁₁ i〕", 1, true)
      - send: yxoaai
        assert: has("也许") and not pair_comment("也许"):find("〔形₂₂₁₁", 1, true) and commit == nil
      - send: yxoaai{BackSpace}
        assert: has("也许") and pair_comment("也许"):find("〔形₂₂₁₁ i〕", 1, true)
  initial_pair_reverse_policy:
    patch:
      translator/word_auxiliary_order: "21"
    tests:
      - send: yx
        assert: has("也许") and pair_comment("也许"):find("〔形₁₁₂₂ ai〕", 1, true)
      - send: yxaioa
        assert: has("也许") and commit == nil
  initial_pair_learning:
    tests:
      # 先证明确实需要学习，再从四辅全码上屏，确认下一次短辅码首选前移。
      - send: yxv
        assert: (cand[1].text ~= "也需") or error(pair_probe())
      - send: yxvoai
        assert: (cand[1].text == "也需") or error(pair_probe())
      - send: "yxvoai yxv"
        assert: (cand[1].text == "也需") or error(pair_probe())
