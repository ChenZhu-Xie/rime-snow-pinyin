schema: snow_sanpin
source_dir: ..
script: |
  function has(something)
    for _, v in ipairs(cand) do
      if v.text == something then
        return true
      end
    end
    return false
  end
deploy:
  sentence:
    patch:
      'switches/@4/reset': 0
    tests:
      - send: bkxhpdfd
        assert: cand[1].text == "冰雪拼音"
  popping:
    tests:
      # 组词规则
      - send: bki
        assert: cand[1].text == "冰"
      - send: bkxh
        assert: has("冰雪")
      - send: jdypaa
        assert: has("近世")
      - send: yrf
        assert: has("输入法")
      - send: bhhivi
        assert: has("白花花")
      - send: wmxj
        assert: has("充满希望")
      - send: jjjwui
        assert: has("经济基础")
      - send: ejyrF
        assert: has("中文输入法")
      - send: ehrmGHG
        assert: has("中华人民共和国")
      # 固顶词
      - send: p
        assert: cand[1].text == "平"
      - send: xh
        assert: cand[1].text == "学"
      - send: by
        assert: cand[1].text == "表示"
      - send: fpgs
        assert: cand[1].text == "一个"
      # 首选后置
      - send: ypyp
        assert: cand[1].text == "事实"
      - send: ypypv
        assert: cand[2].text == "事实"
      # 顶功
      - send: fpgsfpgs
        assert: commit == "一个" and cand[1].text == "一个"
      - send: bkixhu
        assert: commit == "冰" and cand[1].text == "雪"
      - send: pdfdyrf
        assert: commit == "拼音" and cand[1].text == "输入法"
      # 动态码长
      - send: "ypypiaypyp"
        assert: cand[1].text == "誓师"
      # 缓冲造词
      - send: "vwq myi  wqmy"
        assert: cand[1].text == "长猫"
