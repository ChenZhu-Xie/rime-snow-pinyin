schema: snow_sanpin
source_dir: ..
script: |
  -- 与上游相同：候选在完整列表中的名次，以及首页（page_size = 6）判定。
  function rank(something)
    for i, v in ipairs(cand) do
      if v.text == something then return i end
    end
    return math.huge
  end
  function has(something)
    return rank(something) < math.huge
  end
  function page(something)
    return rank(something) <= 6
  end
  function comment(something)
    for _, v in ipairs(cand) do
      if v.text == something then return v.comment end
    end
    return ""
  end
  function pinned(index)
    return cand[index] ~= nil and cand[index].comment:find("📌") ~= nil
  end
  function eq(left, right)
    print("Left  = " .. tostring(left))
    print("Right = " .. tostring(right))
    return left == right
  end
deploy:
  cross_route_user_phrase:
    tests:
      # 用前三字完整声韵、第四字声母唯一上屏“方案选单”，再退回 frxd 验证跨路径用户词优先。
      - send: "fYrMxTd frxd"
        assert: cand[1].text == "方案选单"
  sentence:
    patch:
      'switches/@4/reset': 0
    tests:
      # 上游 bgxhpbyb：本地 QZ 四字主码为 bxpy，再按词语首辅顺序补调码 ui。
      - send: bxpyui
        assert: cand[1].text == "冰雪拼音"
      # 上游 bgvxhupbvybv：四字逐音节打满声韵调；神韵调码 1=i、3=u。
      - send: bkixeupriyri
        assert: cand[1].text == "冰雪拼音"
  popping:
    tests:
      # u 前缀的独立笔画反查沿用三拼调键序：横竖撇点折 → ivuao。
      - send: ui
        assert: has("一")
      - send: uv
        assert: has("丨")
      - send: uu
        assert: has("丿")
      - send: ua
        assert: has("丶")
      - send: uo
        assert: has("乙")
      # r5 不应占用单键 r，仍能查询其他 r 声母的字
      - send: r
        assert: page("人") and has("日")
      # 上游词典新增 gue2；三拼完整码以二声键 v 区分。
      - send: gkv
        assert: has("𨭗")
      # r5 并入 er5 后，按本地神韵零声母与 er 韵键输入轻声「兒」
      - send: cjv
        assert: has("兒")
      # 组词规则
      - send: bki
        assert: cand[1].text == "冰"
      # 未键入调辅时，单字、三字词、四字词分别提示下一至两个调辅键。
      - send: bk
        assert: has("冰") and comment("冰"):find("〔调 i〕", 1, true)
      - send: lrf
        assert: has("输入法") and comment("输入法"):find("〔调₂₁₃ ai〕", 1, true)
      - send: jjjs
        assert: has("经济基础") and comment("经济基础"):find("〔调₂₃ ai〕", 1, true)
      # 单字 IR+B1+B2：冰首笔丶 → o；当首笔丨 → i。
      - send: bkio
        assert: has("冰")
      - send: dyii
        assert: has("当")
      - send: bkxe
        assert: has("冰雪")
      - send: jrlfaa
        assert: has("近世")
      - send: lrf
        assert: has("输入法")
      - send: bhhivi
        assert: has("白花花")
      - send: smxw
        assert: has("充满希望")
      # 编码导航：14567 直达字位；Y/O 物理循环，U/I 逻辑左/右循环
      - send: "smxw1{BackSpace}"
        assert: eq(preedit, "m x w")
      - send: "smxw4{BackSpace}"
        assert: eq(preedit, "sxw")
      - send: "smxw5{BackSpace}"
        assert: eq(preedit, "smw")
      - send: "smxw6{BackSpace}"
        assert: eq(preedit, "s m x")
      - send: "smxw7{BackSpace}"
        assert: eq(preedit, "s m x")
      - send: "smxw{Control+y}{BackSpace}"
        assert: eq(preedit, "smw")
      - send: "smxw1{Control+u}{BackSpace}"
        assert: eq(preedit, "s m x")
      - send: "smxw1{Control+i}{BackSpace}"
        assert: eq(preedit, "sxw")
      - send: "smxw1{Control+y}{Control+y}{Control+y}{BackSpace}"
        assert: eq(preedit, "smw")
      - send: "smxw{Control+o}{Control+o}{BackSpace}"
        assert: eq(preedit, "m x w")
      - send: jjjsai
        assert: has("经济基础")
      - send: kwlrF
        assert: has("中文输入法")
      - send: khrmGHG
        assert: has("中华人民共和国")
      # 上游 p/xh/bg：单字 1、2、3 键构词（并：bg→bd，宾：bb→bg）。
      - send: bk
        assert: cand[1].text == "并"
      - send: br
        assert: cand[1].text == "宾"
      # 双字简码（4/5）与全码（6），声调按第一字、第二字排列。
      - send: bkxei
        assert: has("冰雪")
      - send: bkxeiu
        assert: page("冰雪")
      # 三字简码 3/4/5 与全码 6，声调字位顺序为 2、1、3。
      - send: lrfa
        assert: page("输入法")
      - send: lrfai
        assert: page("输入法")
      - send: lrfaiu
        assert: page("输入法")
      # 四字简码 4/5 与全码 6，前两个声调取第二、第三字。
      - send: smxwu
        assert: page("充满希望")
      - send: smxwui
        assert: page("充满希望")
      # 上游 b/d/s/y：一码固顶；本地三码 630 与两简词取本地固顶词表。
      - send: b
        assert: cand[1].text == "不"
      - send: w
        assert: cand[1].text == "我"
      - send: y
        assert: cand[1].text == "有" and has("1")
      # 上游 be/fg/gc/yo：两声母固顶；本地使用 bg/hou/by/ylgs 等实际固顶。
      - send: bg
        assert: cand[1].text == "博"
      # 上游 ba/bi：声母 + 末字声调的两键 630 固顶词。
      - send: ba
        assert: cand[1].text == "毕竟"
      - send: bi
        assert: cand[1].text == "北京"
      # 上游 bai/biu（双字）、bia（多字）：630 三键不同词长。
      - send: bai
        assert: cand[1].text == "帮助"
      - send: biu
        assert: cand[1].text == "本身"
      - send: bui
        assert: cand[1].text == "保险公司"
      - send: coo
        assert: cand[1].text == "藏着呢"
      # 固顶词
      - send: p
        assert: cand[1].text == "平"
      - send: xe
        assert: cand[1].text == "学"
      - send: bhyz
        assert: cand[1].text == "不要"
      - send: fl
        assert: cand[1].text == "非" and not has("(zhei4)")
      - send: sl
        assert: not has("(sei1)")
      - send: slu
        assert: not has("(sei3)")
      - send: gl
        assert: cand[1].text == "给"
      # 字母入口与键道共享 c 列，三拼统一追加轻声键 o。
      - send: gq
        assert: cand[1].text == "挂" and not has("G") and not has("g")
      - send: gco
        assert: cand[1].text == "G" and cand[2].text == "g"
      - send: gca
        assert: not has("G") and not has("g")
      # 数字按当前 U357 声韵调语义重编码，不沿用上游的物理键位。
      - send: cj
        assert: cand[1].text == "二" and cand[2].text == "2"
      - send: sm
        assert: cand[1].text == "三" and cand[2].text == "3"
      - send: sfa
        assert: cand[1].text == "四" and cand[2].text == "4"
      - send: qp
        assert: cand[1].text == "强" and not has("2")
      - send: sl
        assert: not has("(chei1)") and not has("(chei2)") and not has("(chei3)") and not has("(chei4)")
      - send: sd
        assert: not has("四但")
      - send: rc
        assert: not has("人从")
      - send: ja
        assert: cand[1].text == "就是"
      - send: yj
        assert: cand[1].text == "以及"
      - send: hzbp
        assert: cand[1].text == "好吧"
      - send: ho
        assert: cand[1].text == "好的吧"
      - send: xo
        assert: cand[1].text == "行吧"
      - send: xov
        assert: cand[1].text == "行叭"
      - send: yfgs
        assert: cand[1].text == "一个"
      # 以词定字：[ 取词首，] 取词尾
      - send: "yfgs["
        assert: commit == "一"
      - send: "yfgs]"
        assert: commit == "个"
      # 单字定字：[ 重复该字，] 在该字后追加“得”
      - send: "p["
        assert: commit == "平平"
      - send: "p]"
        assert: commit == "平得"
      - send: npyy
        assert: cand[1].text == "那样"
      - send: tjvvi
        assert: has("填") and cand[rank("填")].comment:find("vivv")
      # 首选后置
      - send: lflf
        assert: cand[1].text == "事实"
      - send: lflfa
        assert: cand[2].text == "事实"
      # 二字词首辅取第一字；「事」为四声，故追加 a 后将短码首选「事实」后置。
      # 顶功
      - send: yfgsyfgs
        assert: commit == "一个" and cand[1].text == "一个"
      - send: bkixeu
        assert: commit == "冰" and cand[1].text == "雪"
      - send: pryrlrf
        assert: commit == "拼音" and cand[1].text == "输入法"
      # 强制上屏尾字；原 d/l 一码仍然保留
      - send: yfgs;
        assert: commit == "一个的"
      - send: yfgs/
        assert: commit == "一个了"
      - send: d
        assert: cand[1].text == "都"
      - send: l
        assert: cand[1].text == "是"
      # 上游 pbg / xhbg / erf b：短码不能被后续声母顶出。
      - send: pbk
        assert: commit == nil or commit == ""
      - send: xebk
        assert: commit == nil or commit == ""
      - send: "xe "
        assert: commit == "学"
      - send: lrfb
        assert: commit == nil or commit == ""
      - send: "lrf "
        assert: commit == "输入法"
      # 上游 bja2：选字键 2 选择小写拉丁字母。
      - send: bco2
        assert: commit == "b"
      # 动态码长、组词及顶功。「史诗」在新 12 辅序下五码已成为首选，
      # 第六码会按首选后置规则将其移开；改用五码尚非首选、六码才首选的「实时」。
      - send: "lflfailflf"
        assert: cand[1].text == "誓师"
      - send: lflfvv
        assert: cand[1].text == "实时"
      - send: lflfvvlflf
        assert: commit == "实时" and cand[1].text == "实时"
  buffered_command:
    tests:
      - send: o
        assert: cand[1].text == "📝 开启缓冲" and commit == nil
      - send: "o "
        assert: commit == nil and preedit == nil
      - send: "o o"
        assert: cand[1].text == "📝 关闭缓冲" and commit == nil
      - send: "o o "
        assert: commit == nil and preedit == nil
      - send: "o{Escape}lrf "
        assert: commit == "输入法"
      - send: "o bkxelrf "
        assert: commit == nil
      - send: "o bkxelrf  lrf "
        assert: commit == "冰雪输入法输入法"
  # 六码二字词选完首字后，第二字可由下一个词顶屏，并与首字一起完成造词。
  encoding_popping:
    tests:
      - send: "bksfia b{Escape}bksf"
        assert: cand[1].text == "冰四"
  encoding_buffered:
    tests:
      - send: "o bksfia   bksf"
        assert: cand[1].text == "冰四"
  # 上游 buffered：分片组词、字母候选与英数混输；本地选择 o 命令切换缓冲。
  buffered:
    tests:
      - send: "o sy mz  symz"
        assert: cand[1].text == "长猫"
      - send: "o bkxelrf  bxlrF"
        assert: cand[1].text == "冰雪输入法"
      # 键道与三拼共享二键基码；三拼统一追加轻声键 o。
      - send: bco
        assert: cand[1].text == "B" and cand[2].text == "b"
      - send: xwo
        assert: cand[1].text == "A" and cand[2].text == "a"
      # 新大字集让 tco/hco/xgo/xlo 与轻声读音重合，字母固顶仍须优先。
      - send: tco
        assert: cand[1].text == "T" and cand[2].text == "t"
      - send: hco
        assert: cand[1].text == "H" and cand[2].text == "h"
      - send: xgo
        assert: cand[1].text == "V" and cand[2].text == "v"
      - send: xlo
        assert: cand[1].text == "I" and cand[2].text == "i"
      # 上游 wjugjatyxb/dlvlsvikkamr：中文数词、字母与汉字共同造词。
      - send: "o whu gco tli xra  wgtx"
        assert: cand[1].text == "五G通信"
      # 哆、啦、梦均不在 QZ 完整音码首选，按实际候选位取字后验证英数混输造词。
      - send: "o dki{Down}{Down}{space}epo{Down}{space}xwo mta{Down}{space} dexm"
        assert: cand[1].text == "哆啦A梦"
  # 声声二字词的一次声调辅码，以及三字及以上简拼的大写补韵。
  initial_pair_and_mixed_spelling:
    tests:
      - send: yxu
        assert: has("也许") and not has("一些") and preedit == "y x 调[u]"
      # 必须按词条实际读音 xu1 筛选；大字集里的「需 ru2」不能让「也需」混入二声桶。
      - send: yxv
        assert: not has("也需")
      - send: "yxu "
        assert: utf8.len(commit) == 2 and not commit:find("u", 1, true)
      - send: yxub
        assert: utf8.len(commit) == 2 and not commit:find("u", 1, true)
      - send: yxi
        assert: has("一些") and has("也需") and not has("也许")
      - send: lHrf
        assert: has("输入法")
      - send: lrfP
        assert: has("输入法")
      - send: lHrHfP
        assert: has("输入法")
      - send: zFxKsS
        assert: has("自行车")
  # 上游 advanced：反查、重复上屏、数字日期、笔画/部首辅助码、以词定字。
  advanced:
    tests:
      - send: azhe
        assert: cand[1].text == "这" and has("着")
      # 部件全拼反查：连续输入各部件读音，候选同时显示拼音。
      - send: "uwangyan"
        assert: page("琰") and cand[rank("琰")].comment:find("yan3", 1, true) ~= nil and commit == nil
      - send: "umaowenniao"
        assert: page("鹜") and cand[rank("鹜")].comment:find("wu4", 1, true) ~= nil and commit == nil
      # 单引号结束反查后可正常上屏，退格重输仍留在反查段。
      - send: "uwangyan' "
        assert: commit == "琰"
      - send: "uwangyan{BackSpace}n"
        assert: page("琰") and commit == nil
      # 独立笔画反查使用调键序 IVUAO；主方案的调后笔辅另按形义序 VIUOA。
      - send: uivuao
        assert: cand[1].text == "札"
      - send: "slfh i"
        assert: cand[1].text == "重复"
      - send: ia
        assert: cand[1].text == "ā"
      - send: o123
        assert: cand[1].text == "一百二十三" and has("壹佰贰拾叁")
      # Unicode 码点
      - send: o4e00
        assert: cand[1].text == "一"
      # Lua 脚本：计算表达式
      - send: o1234*5678
        assert: has("7006652")
      - send: orq
        assert: cand[1].text:match("^%d+年%d+月%d+日$") ~= nil
      - send: osj
        assert: cand[1].text:match("^%d+时%d+分%d+秒$") ~= nil
      - send: ors
        assert: cand[1].text:match("^%d+年%d+月%d+日%d+时%d+分%d+秒$") ~= nil
      # 芫 yuan2：U357 声韵调为 yrv，前两笔横竖 → vi。
      - send: ytvvi
        assert: page("芫")
      # 嶅 ao2：U357 为 rfv，与“饶”等音节碰撞；山部首首码 e 将它保留在首页。
      - send: rzvvv
        assert: not page("嶅")
      - send: rzv1l
        assert: page("嶅")
      - send: "xfry["
        assert: commit == "熙"
      # 上游以第三候选「蔷薇」取末字；本地用 jpdz 的非首选「剪刀」验证同一操作。
      - send: "jjdz{Down}]"
        assert: commit == "刀"
  # 上游 schema_userdb：按顺序操作同一次部署的方案码用户词典。
  schema_userdb:
    tests:
      # 上游 bmms → 本地 bian/ma = bp/mw；固定键 Ctrl+; → Ctrl+/。
      - send: bjmp
        assert: not pinned(1)
      - send: "bjmp{Control+slash}bjmp"
        assert: cand[1].text == "编码" and pinned(1)
      - send: "bjmp{Control+slash}bjmp"
        assert: not pinned(1)
      # 上游修复后，无编码时由应用接收的大写字母和数字也会纳入新词。
      - send: "fpx{Control+period}fpxqS Vw 50{Control+period}fpx"
        assert: cand[1].text == "疯狂星期四V我50"
      # QZ 弎拼 xov 固顶“行叭”：新词不得挤掉已有的首选。
      - send: "xov{Control+period}fpxqS {Control+period}xov"
        assert: cand[1].text == "行叭" and cand[2].text == "疯狂星期四"
      # 上游 jmdz → 本地 jian/dao = jp/dz；交换、复原和重置固定位次。
      - send: "jjdz{Control+slash}{Down}{Control+slash}{Up}"
        assert: cand[1].text == "见到" and cand[2].text == "剪刀"
      - send: "jjdz{Control+bracketright}jjdz"
        assert: cand[1].text == "剪刀" and cand[2].text == "见到"
      - send: "jjdz{Down}{Control+bracketleft}jjdz"
        assert: cand[1].text == "见到" and cand[2].text == "剪刀"
      - send: "jjdz{Control+backslash}jjdz"
        assert: not pinned(1) and not pinned(2)
  shape_g:
    patch:
      translator/shape_sources: [G]
    tests:
      # 主方案 B2 为 viuoa；令的 G/T/J 笔顺分别为 34454/34154/34152。
      - send: ekauooao
        assert: has("令")
      - send: ekauovao
        assert: not has("令")
  shape_t:
    patch:
      translator/shape_sources: [T]
    tests:
      - send: ekauovao
        assert: has("令")
      - send: ekauooao
        assert: not has("令")
  shape_none:
    patch:
      translator/shape_sources: []
    tests:
      - send: eka
        assert: has("令")
      - send: ekau
        assert: not has("令")
