schema: snow_sanpin
source_dir: ..
script: |
  -- 与上游相同：候选在完整列表中的名次，以及首页（page_size = 6）判定。
  function rank(something)
    for i, v in ipairs(cand) do
      if v.text == something then return i end
    end
    return math.huge
  end
  function has(something)
    return rank(something) < math.huge
  end
  function page(something)
    return rank(something) <= 6
  end
  function pinned(index)
    return cand[index] ~= nil and cand[index].comment:find("📌") ~= nil
  end
  function eq(left, right)
    print("Left  = " .. tostring(left))
    print("Right = " .. tostring(right))
    return left == right
  end
deploy:
  sentence:
    patch:
      'switches/@4/reset': 0
    tests:
      # 上游 bgxhpbyb：两字词连输；U357 双拼为 bt xk pb yb。
      - send: btxkpbyb
        assert: cand[1].text == "冰雪拼音"
      # 上游 bgvxhupbvybv：四字逐音节打满声韵调；神韵调码 1=i、3=u。
      - send: btixkupbiybi
        assert: cand[1].text == "冰雪拼音"
  popping:
    tests:
      # 笔画反查按三拼声调键序映射：横竖撇捺折 → ivuao。
      - send: ui
        assert: has("一")
      - send: uv
        assert: has("丨")
      - send: uu
        assert: has("丿")
      - send: ua
        assert: has("丶")
      - send: uo
        assert: has("乙")
      # r5 不应占用单键 r，仍能查询其他 r 声母的字
      - send: r
        assert: page("人") and has("日")
      # 上游词典新增 gue2；三拼完整码以二声键 v 区分。
      - send: gkv
        assert: has("𨭗")
      # r5 并入 er5 后，按本地神韵零声母与 er 韵键输入轻声「兒」
      - send: reo
        assert: has("兒")
      # 组词规则
      - send: bti
        assert: cand[1].text == "冰"
      # 单字 IR+B1+B2：冰首笔丶 → a；当首笔丨 → v。
      - send: btia
        assert: has("冰")
      - send: dniv
        assert: has("当")
      - send: btxk
        assert: has("冰雪")
      - send: jbelaa
        assert: has("近世")
      - send: erf
        assert: has("输入法")
      - send: bhhivi
        assert: has("白花花")
      - send: wmxs
        assert: has("充满希望")
      # 编码导航：14567 直达字位；Y/O 物理循环，U/I 逻辑左/右循环
      - send: "wmxs1{BackSpace}"
        assert: eq(preedit, "m x s")
      - send: "wmxs4{BackSpace}"
        assert: eq(preedit, "wxs")
      - send: "wmxs5{BackSpace}"
        assert: eq(preedit, "wms")
      - send: "wmxs6{BackSpace}"
        assert: eq(preedit, "w m x")
      - send: "wmxs7{BackSpace}"
        assert: eq(preedit, "w m x")
      - send: "wmxs{Control+y}{BackSpace}"
        assert: eq(preedit, "wms")
      - send: "wmxs1{Control+u}{BackSpace}"
        assert: eq(preedit, "w m x")
      - send: "wmxs1{Control+i}{BackSpace}"
        assert: eq(preedit, "wxs")
      - send: "wmxs1{Control+y}{Control+y}{Control+y}{BackSpace}"
        assert: eq(preedit, "wms")
      - send: "wmxs{Control+o}{Control+o}{BackSpace}"
        assert: eq(preedit, "m x s")
      - send: jjjwui
        assert: has("经济基础")
      - send: kserF
        assert: has("中文输入法")
      - send: khrmGHG
        assert: has("中华人民共和国")
      # 上游 p/xh/bg：单字 1、2、3 键构词（并：bg→bd，宾：bb→bg）。
      - send: bt
        assert: cand[1].text == "并"
      - send: bb
        assert: cand[1].text == "宾"
      # 上游 bgxhu/bg xhuv：双字简码（4/5）与全码（6），末字调在前。
      - send: btxku
        assert: has("冰雪")
      - send: btxkui
        assert: page("冰雪")
      # 上游 erf / erfu / erfuv / erfuvo：三字简码 3/4/5 与全码 6。
      - send: erfu
        assert: page("输入法")
      - send: erfui
        assert: page("输入法")
      - send: erfuia
        assert: page("输入法")
      # 上游 wmxw / wmxwo / wmxwov：四字简码 4/5 与全码 6。
      - send: wmxsa
        assert: page("充满希望")
      - send: wmxsai
        assert: page("充满希望")
      # 上游 b/d/s/y：一码固顶；本地三码 630 与两简词取本地固顶词表。
      - send: b
        assert: cand[1].text == "不"
      - send: s
        assert: cand[1].text == "我"
      - send: y
        assert: cand[1].text == "一"
      # 上游 be/fg/gc/yo：两声母固顶；本地使用 bg/hou/by/ylgs 等实际固顶。
      - send: bg
        assert: cand[1].text == "不过"
      # 上游 ba/bi：声母 + 末字声调的两键 630 固顶词。
      - send: ba
        assert: cand[1].text == "毕竟"
      - send: bi
        assert: cand[1].text == "北京"
      # 上游 bai/biu（双字）、bia（多字）：630 三键不同词长。
      - send: bai
        assert: cand[1].text == "帮助"
      - send: biu
        assert: cand[1].text == "本身"
      - send: bui
        assert: cand[1].text == "保险公司"
      # 固顶词
      - send: p
        assert: cand[1].text == "平"
      - send: xk
        assert: cand[1].text == "学"
      - send: by
        assert: cand[1].text == "不要"
      - send: fe
        assert: cand[1].text == "飞" and not has("(zhei4)")
      - send: se
        assert: not has("(sei1)")
      - send: seu
        assert: not has("(sei3)")
      - send: ge
        assert: cand[1].text == "给"
      # 字母入口与键道共享 c 列，三拼统一追加轻声键 o。
      - send: gc
        assert: cand[1].text == "挂" and has("G") and has("g")
      - send: gco
        assert: cand[1].text == "G" and cand[2].text == "g"
      - send: gca
        assert: not has("G") and not has("g")
      - send: we
        assert: not has("(chei1)") and not has("(chei2)") and not has("(chei3)") and not has("(chei4)")
      - send: sd
        assert: not has("四但")
      - send: rc
        assert: not has("人从")
      - send: ja
        assert: cand[1].text == "就是"
      - send: yv
        assert: cand[1].text == "以及"
      - send: hou
        assert: cand[1].text == "好吧"
      - send: ho
        assert: cand[1].text == "好的吧"
      - send: xo
        assert: cand[1].text == "行吧"
      - send: xov
        assert: cand[1].text == "行叭"
      - send: ylgs
        assert: cand[1].text == "一个"
      # 以词定字：[ 取词首，] 取词尾
      - send: "ylgs["
        assert: commit == "一"
      - send: "ylgs]"
        assert: commit == "个"
      - send: nwyn
        assert: cand[1].text == "那样"
      - send: tpviv
        assert: has("填") and cand[rank("填")].comment:find("ivii")
      # 首选后置
      - send: elel
        assert: cand[1].text == "事实"
      - send: elelv
        assert: cand[2].text == "事实"
      # 上游 ekeki：首选后置的触发调键因本地神韵映射变为 v。
      # 顶功
      - send: ylgsylgs
        assert: commit == "一个" and cand[1].text == "一个"
      - send: btixku
        assert: commit == "冰" and cand[1].text == "雪"
      - send: pbyberf
        assert: commit == "拼音" and cand[1].text == "输入法"
      # 强制上屏尾字；原 d/l 一码仍然保留
      - send: ylgs;
        assert: commit == "一个的"
      - send: ylgs/
        assert: commit == "一个了"
      - send: d
        assert: cand[1].text == "的"
      - send: l
        assert: cand[1].text == "了"
      # 上游 pbg / xhbg / erf b：短码不能被后续声母顶出。
      - send: pbt
        assert: commit == nil or commit == ""
      - send: xkbt
        assert: commit == nil or commit == ""
      - send: "xk "
        assert: commit == "学"
      - send: erfb
        assert: commit == nil or commit == ""
      - send: "erf "
        assert: commit == "输入法"
      # 上游 bja2：选字键 2 选择小写拉丁字母。
      - send: bco2
        assert: commit == "b"
      # 上游 ekekvo / ekekvu / ekekvuekek：动态码长、组词及顶功。
      - send: "eleliaelel"
        assert: cand[1].text == "誓师"
      - send: eleliu
        assert: cand[1].text == "史诗"
      - send: eleliuelel
        assert: commit == "史诗" and cand[1].text == "史诗"
  buffered_command:
    tests:
      - send: o
        assert: cand[1].text == "📝 开启缓冲" and commit == nil
      - send: "o "
        assert: commit == nil and preedit == nil
      - send: "o o"
        assert: cand[1].text == "📝 关闭缓冲" and commit == nil
      - send: "o o "
        assert: commit == nil and preedit == nil
      - send: "o{Escape}erf "
        assert: commit == "输入法"
      - send: "o btxkerf "
        assert: commit == nil
      - send: "o btxkerf  erf "
        assert: commit == "冰雪输入法输入法"
  # 六码二字词选完首字后，第二字可由下一个词顶屏，并与首字一起完成造词。
  encoding_popping:
    tests:
      - send: "btslai b{Escape}btsl"
        assert: cand[1].text == "冰四"
  encoding_buffered:
    tests:
      - send: "o btslai   btsl"
        assert: cand[1].text == "冰四"
  # 上游 buffered：分片组词、字母候选与英数混输；本地选择 o 命令切换缓冲。
  buffered:
    tests:
      - send: "o wn mfi  wnmf"
        assert: cand[1].text == "长猫"
      - send: "o btxkerf  bxerF"
        assert: cand[1].text == "冰雪输入法"
      # 键道与三拼共享二键基码；三拼统一追加轻声键 o。
      - send: bco
        assert: cand[1].text == "B" and cand[2].text == "b"
      - send: xwo
        assert: cand[1].text == "A" and cand[2].text == "a"
      # 新大字集让 tco/hco/xgo/xlo 与轻声读音重合，字母固顶仍须优先。
      - send: tco
        assert: cand[1].text == "T" and cand[2].text == "t"
      - send: hco
        assert: cand[1].text == "H" and cand[2].text == "h"
      - send: xgo
        assert: cand[1].text == "V" and cand[2].text == "v"
      - send: xlo
        assert: cand[1].text == "I" and cand[2].text == "i"
      # 上游 wjugjatyxb/dlvlsvikkamr：中文数词、字母与汉字共同造词。
      - send: "o shu gco tpi xba  jgtx"
        assert: commit == "五G通信"
      # 啦读轻声 la5（lwo），梦的二码固顶为 mn；la1/meng4 的首选会组成「垃/孟」。
      - send: "o dyi lwo xwo mr  dlxm"
        assert: commit == "哆啦A梦"
  # 声声二字词的一次声调辅码，以及三字及以上简拼的大写补韵。
  initial_pair_and_mixed_spelling:
    tests:
      - send: yxu
        assert: has("也许") and not has("一些") and preedit == "y x 调[u]"
      # 必须按词条实际读音 xu1 筛选；大字集里的「需 ru2」不能让「也需」混入二声桶。
      - send: yxv
        assert: not has("也需")
      - send: "yxu "
        assert: utf8.len(commit) == 2 and not commit:find("u", 1, true)
      - send: yxub
        assert: utf8.len(commit) == 2 and not commit:find("u", 1, true)
      - send: yxi
        assert: has("一些") and has("也需") and not has("也许")
      - send: eHrf
        assert: has("输入法")
      - send: erfW
        assert: has("输入法")
      - send: eHrHfW
        assert: has("输入法")
      - send: zLxTwS
        assert: has("自行车")
  # 上游 advanced：反查、重复上屏、数字日期、笔画/部首辅助码、以词定字。
  advanced:
    tests:
      - send: azhe
        assert: cand[1].text == "这" and has("着")
      # 本地横竖撇点折依次为 i/v/u/a/o（上游为 v/i/u/o/a）。
      - send: uivuao
        assert: cand[1].text == "札"
      - send: "wpfh i"
        assert: cand[1].text == "重复"
      - send: ia
        assert: cand[1].text == "ā"
      - send: o123
        assert: cand[1].text == "一百二十三" and has("壹佰贰拾叁")
      # Unicode 码点
      - send: o4e00
        assert: cand[1].text == "一"
      # Lua 脚本：计算表达式
      - send: o1234*5678
        assert: has("7006652")
      - send: orq
        assert: cand[1].text:match("^%d+年%d+月%d+日$") ~= nil
      - send: osj
        assert: cand[1].text:match("^%d+时%d+分%d+秒$") ~= nil
      - send: ors
        assert: cand[1].text:match("^%d+年%d+月%d+日%d+时%d+分%d+秒$") ~= nil
      # 芫 yuan2：上游 ytivi → 本地 ye + v + iv。
      - send: yrviv
        assert: page("芫")
      # 嶅 ao2：U357 为 rfv，与“饶”等音节碰撞；山部首首码 e 将它保留在首页。
      - send: rfvvv
        assert: not page("嶅")
      - send: rfv1e
        assert: page("嶅")
      - send: "xlrn["
        assert: commit == "熙"
      # 上游以第三候选「蔷薇」取末字；本地用 jpdz 的非首选「剪刀」验证同一操作。
      - send: "jpdf{Down}]"
        assert: commit == "刀"
  # 上游 schema_userdb：按顺序操作同一次部署的方案码用户词典。
  schema_userdb:
    tests:
      # 上游 bmms → 本地 bian/ma = bp/mw；固定键 Ctrl+; → Ctrl+/。
      - send: bpmw
        assert: not pinned(1)
      - send: "bpmw{Control+slash}bpmw"
        assert: cand[1].text == "编码" and pinned(1)
      - send: "bpmw{Control+slash}bpmw"
        assert: not pinned(1)
      # 上游修复后，无编码时由应用接收的大写字母和数字也会纳入新词。
      - send: "kfc{Control+period}fkxqS Vs 50{Control+period}kfc"
        assert: cand[1].text == "疯狂星期四V我50"
      # U357 三拼 hou 固顶“好吧”：新词不得挤掉已有的首选；单独 v 已不再切换缓冲。
      - send: "hou{Control+period}ljhe {Control+period}hou"
        assert: cand[1].text == "好吧" and cand[2].text == "垃圾回收"
      # 上游 jmdz → 本地 jian/dao = jp/dz；交换、复原和重置固定位次。
      - send: "jpdf{Control+slash}{Down}{Control+slash}{Up}"
        assert: cand[1].text == "见到" and cand[2].text == "剪刀"
      - send: "jpdf{Control+bracketright}jpdf"
        assert: cand[1].text == "剪刀" and cand[2].text == "见到"
      - send: "jpdf{Down}{Control+bracketleft}jpdf"
        assert: cand[1].text == "见到" and cand[2].text == "剪刀"
      - send: "jpdf{Control+backslash}jpdf"
        assert: not pinned(1) and not pinned(2)
  shape_g:
    patch:
      translator/shape_sources: [G]
    tests:
      # 本地三拼笔画键为 ivuao；令的 G/T/J 笔顺分别为 34454/34154/34152。
      - send: "uuaaoa"
        assert: has("令")
      - send: "uuaioa"
        assert: not has("令")
      - send: ltauaaoa
        assert: has("令")
      - send: ltauaioa
        assert: not has("令")
  shape_t:
    patch:
      translator/shape_sources: [T]
    tests:
      - send: "uuaioa"
        assert: has("令")
      - send: "uuaaoa"
        assert: not has("令")
      - send: ltauaioa
        assert: has("令")
      - send: ltauaaoa
        assert: not has("令")
  shape_none:
    patch:
      translator/shape_sources: []
    tests:
      - send: lta
        assert: has("令")
      - send: ltau
        assert: not has("令")
