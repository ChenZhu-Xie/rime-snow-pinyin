schema: snow_shenyun_shape
source_dir: ..
script: |
  function rank(text)
    for index, candidate in ipairs(cand) do
      if candidate.text == text then return index end
    end
    return math.huge
  end
  function has(text)
    return rank(text) < math.huge
  end
  function page(text)
    return rank(text) <= 6
  end
  function all_have_length(length)
    if #cand == 0 then return false end
    for _, candidate in ipairs(cand) do
      if utf8.len(candidate.text) ~= length then return false end
    end
    return true
  end
deploy:
  reverse_lookup:
    tests:
      # 部件全拼与笔画反查共用 u 入口，候选同时显示拼音。
      - send: "uwangyan"
        assert: page("琰") and cand[rank("琰")].comment:find("yan3", 1, true) ~= nil and commit == nil
      - send: "umaowenniao"
        assert: page("鹜") and cand[rank("鹜")].comment:find("wu4", 1, true) ~= nil and commit == nil
      # 单引号结束反查后可正常上屏，退格重输仍留在反查段。
      - send: "uwangyan' "
        assert: commit == "琰"
      - send: "uwangyan{BackSpace}n"
        assert: page("琰") and commit == nil
      # 共用入口不得破坏原有笔画反查。
      - send: ueiuoa
        assert: cand[1].text == "札"
  buffered_command:
    tests:
      - send: o
        assert: cand[1].text == "📝 开启缓冲" and commit == nil
      - send: "o o"
        assert: cand[1].text == "📝 关闭缓冲" and commit == nil
      - send: "o o "
        assert: commit == nil and preedit == nil
  popping:
    tests:
      # 输入统计沿用公共 lua 前缀 o。
      - send: otj
        assert: cand[1].text == "📖 统计功能说明" and cand[2].text:match("^📊 ") ~= nil
      # D3/V1 换位后的一级固顶字。
      - send: d
        assert: cand[1].text == "都" and cand[1].comment:find("📌", 1, true) and not cand[2].comment:find("📌", 1, true)
      - send: p
        assert: cand[1].text == "配"
      - send: j
        assert: cand[1].text == "我"
      # 占用桶保留汉字首选，字母固定为大写第 2、小写第 3。
      - send: bn
        assert: cand[1].text == "帮" and cand[2].text == "B" and cand[3].text == "b"
      # 单字定字：[ 重复该字，] 在该字后追加“得”
      - send: "j["
        assert: commit == "我我"
      - send: "j]"
        assert: commit == "我得"
      - send: v
        assert: cand[1].text == "是"
      - send: r
        assert: cand[1].text == "人"
      - send: z
        assert: cand[1].text == "在"
      # bing 的 D3/V1 声韵码为 bq，键道式首形码为 o（丶）。
      - send: bq
        assert: all_have_length(1) and has("冰") and preedit == "bq"
      - send: bqo
        assert: has("冰") and preedit == "bq 形[o]"
      # 四码顶的 AU→AUA 中间态不得把「测」顶屏；chvi 为「测试」。
      - send: chvi
        assert: commit == nil and has("测试") and preedit == "ch vi"
      # AU 空桶回退为声声二字词；第三码按第一字首形辅筛选。
      - send: cv
        assert: all_have_length(2) and has("测试")
      # te 是空 AB，不能解释为声声二字词；继续输入辅键形成的 AUB 也暂时保留为空。
      - send: te
        assert: "#cand == 0 and commit == nil"
      - send: tea
        assert: "#cand == 0 and commit == nil"
      - send: wya
        assert: has("也许") and not has("一些")
      - send: wye
        assert: has("一些") and not has("也许")
      # 各级主码候选均随新声韵映射重算：AUAU、AAA、AAAU、AAAA。
      - send: bqyt
        assert: has("冰雪")
      - send: vrf
        assert: has("输入法")
      - send: vrfa
        assert: has("输入法")
      - send: rgsn
        assert: has("人工智能")
      # cv、wy 都不是合法音节；cvwy 只能走 AAAA，不能混入二、三字前缀候选。
      - send: cvwy
        assert: all_have_length(4) and has("测试一下") and not has("测试仪")
      # wi 是合法完整音节，cvwi 仍应走 AAAU 得到三字词。
      - send: cvwi
        assert: all_have_length(3) and has("测试仪")
      - send: dwyru
        assert: has("等一下")
      # ;/ 与 21×21 方案一致：顶出当前候选后追加“的/了”。
      - send: chvi;
        assert: commit == "测试的"
      - send: chvi/
        assert: commit == "测试了"
      # 「管理员」第二字形辅为 e；ye 是占用码，使用标准 AAAU+B 路由。
      - send: glwmu
        assert: has("管理员")
      - send: "bq,"
        assert: commit and commit:find("，", 1, true)
      - send: "bq."
        assert: commit and commit:find("。", 1, true)
