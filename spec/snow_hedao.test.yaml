schema: snow_hedao
source_dir: ..
script: |
  function rank(text)
    for index, candidate in ipairs(cand) do
      if candidate.text == text then return index end
    end
    return math.huge
  end
  function has(text)
    return rank(text) < math.huge
  end
  function page(text)
    return rank(text) <= 6
  end
  function hint_codes()
    local codes = {}
    for index = 2, #cand do
      if not cand[index].comment:match("^[a-z][a-z]$") then break end
      codes[#codes + 1] = cand[index].comment
    end
    return table.concat(codes, " ")
  end
  function all_have_length(length)
    if #cand == 0 then return false end
    for _, candidate in ipairs(cand) do
      if utf8.len(candidate.text) ~= length then return false end
    end
    return true
  end
  function pair_comment(text)
    for _, candidate in ipairs(cand) do
      if candidate.text == text then return candidate.comment end
    end
    return ""
  end
  function pair_probe()
    local parts = { "preedit=" .. tostring(preedit), "commit=" .. tostring(commit) }
    for index = 1, math.min(16, #cand) do
      parts[#parts + 1] = tostring(index) .. ":" .. cand[index].text .. "/" .. cand[index].comment
    end
    return table.concat(parts, " | ")
  end
deploy:
  adaptive_append_shi:
    tests:
      - send: "b]"
        assert: commit == "不是"
      - send: "bu]"
        assert: commit == "不是"
  short_shape_and_stroke_sources:
    tests:
      - send: jiuaa
        assert: commit == nil and cand[1].text == "几"
      - send: wiaa
        assert: commit == nil and cand[1].text == "乙"
  word_length_selection:
    tests:
      - send: "rgsn{less}"
        assert: commit == "人工智能"
      - send: "jqji{greater}"
        assert: commit == "计算机"
      # zr 是空桶，不存在 AAAU 三字路由，必须兜底原生长词补全。
      - send: "wyzr{greater}"
        assert: commit == "有限责任公司"
      # 不足四主码时沿用原有书名号行为。
      - send: "d{less}"
        assert: commit == "都《"
  long_words:
    tests:
      # 四声母保留原生长词补全；大写第五声母明确继续长词，不得先顶屏。
      - send: kyfs
        assert: has("科学发展") and has("科学发展观") and commit == nil
      - send: kyfsG
        assert: (cand[1].text == "科学发展观" and commit == nil) or error(pair_probe())
      - send: shrmGHG
        assert: (cand[1].text == "中华人民共和国" and commit == nil) or error(pair_probe())
      - send: "kyfsG{less}"
        assert: (commit == "科学发展观《") or error(pair_probe())
      - send: "kyfsG "
        assert: (commit == "科学发展观") or error(pair_probe())
      - send: kyfsGd
        assert: (commit == "科学发展观" and preedit == "d") or error(pair_probe())
      - send: "kyfsG,"
        assert: (commit == "科学发展观，") or error(pair_probe())
  long_words_sentence:
    patch:
      'switches/@4/reset': 0
    tests:
      - send: kyfsG
        assert: (cand[1].text == "科学发展观" and commit == nil) or error(pair_probe())
  entry_contract:
    tests:
      # 生僻字补桶须为真实词典候选，不能只由 fixed 兜底造出同名候选。
      - send: xho
        assert: cand[1].text == "㬚" and cand[1].comment:find("📌", 1, true)
      # 数字别名保留汉字首选；鹮道的 3 不得在重生成时再次丢失。
      - send: q
        assert: cand[1].text == "三" and cand[2].text == "3"
  traditional_entry_contract:
    options:
      traditionalization: true
    tests:
      - send: l
        assert: cand[1].text == "來"
  reverse_lookup:
    tests:
      # 部件全拼与笔画反查共用 u 入口，候选同时显示拼音。
      - send: "uwangyan"
        assert: page("琰") and cand[rank("琰")].comment:find("yan3", 1, true) ~= nil and commit == nil
      - send: "umaowenniao"
        assert: page("鹜") and cand[rank("鹜")].comment:find("wu4", 1, true) ~= nil and commit == nil
      # 单引号结束反查后可正常上屏，退格重输仍留在反查段。
      - send: "uwangyan' "
        assert: commit == "琰"
      - send: "uwangyan{BackSpace}n"
        assert: page("琰") and commit == nil
      # 共用入口不得破坏原有笔画反查。
      - send: ueiuoa
        assert: cand[1].text == "札"
  buffered_command:
    tests:
      - send: o
        assert: cand[1].text == "📝 开启缓冲" and commit == nil
      - send: "o o"
        assert: cand[1].text == "📝 关闭缓冲" and commit == nil
      - send: "o o "
        assert: commit == nil and preedit == nil
  popping:
    tests:
      # RC26 的 qz、zq 都是声声空桶，不能保留 UM40 的 zen→zq 单字路径。
      - send: qz
        assert: all_have_length(2) and commit == nil
      - send: zq
        assert: all_have_length(2) and commit == nil
      # 每个声声空桶只取首选词；六个桶按词频排列，第二页先显示最后一桶，再按字频接单字。
      - send: s
        assert: cand[1].text == "这" and hint_codes() == "sx sw sz sv sr sb" and cand[2].text == "支持" and cand[7].text == "这边" and cand[8].text == "中" and cand[9].text == "着" and cand[10].text == "真" and cand[11].text == "只" and cand[12].text == "找" and cand[8].comment:find("〔声韵 sm〕", 1, true)
      # v 是声母；普通声韵桶 ve/vi 不得混入空桶提示。
      - send: v
        assert: cand[1].text == "是" and hint_codes() == "vv vw vr vm vz vx vb"
      # sr 未设固顶项，提示须与声声桶本身的首选一致；sm 有单字，不显示空桶提示。
      - send: sr
        assert: cand[1].text == "转让"
      - send: sm
        assert: cand[1].text == "中" and all_have_length(1)
      # 输入统计沿用公共 lua 前缀 o。
      - send: otj
        assert: cand[1].text == "📖 统计功能说明" and cand[2].text:match("^📊 ") ~= nil
      # RC26-39a5bfdc045342cd 换位后的一级固顶字。
      - send: d
        assert: cand[1].text == "都" and cand[1].comment:find("📌", 1, true) and not cand[2].comment:find("📌", 1, true)
      - send: p
        assert: cand[1].text == "跑"
      - send: j
        assert: cand[1].text == "我"
      # 占用桶保留汉字首选，字母固定为大写第 2、小写第 3。
      - send: bn
        assert: cand[1].text == "帮" and cand[2].text == "B" and cand[3].text == "b"
      # 单字定字：[ 重复该字，] 在该字后追加「是」
      - send: "j["
        assert: commit == "我我"
      - send: "j]"
        assert: (commit == "就是") or error("adaptive commit=" .. tostring(commit))
      - send: r
        assert: cand[1].text == "人"
      - send: z
        assert: cand[1].text == "在"
      # bing 的 RC26-39a5bfdc045342cd 声韵码为 bq，键道式首形码为 o（丶）。
      - send: bq
        assert: all_have_length(1) and has("冰") and preedit == "bq"
      - send: bqo
        assert: cand[1].text == "病" and cand[1].comment:find("📌", 1, true) and has("冰") and preedit == "bq 形[o]"
      # 继续补辅时，三级固顶不延伸到四码；「冰」升首选，「病」按短码首选后置。
      - send: bqoe
        assert: cand[1].text == "冰" and rank("病") == 2 and not cand[rank("病")].comment:find("📌", 1, true)
      # 四码顶的 AU→AUA 中间态不得把「测」顶屏；chvi 为「测试」。
      - send: chvi
        assert: commit == nil and has("测试") and preedit == "ch vi"
      # AU 空桶回退为声声二字词；按标准二字词辅序反向，先用第二字前两辅筛选。
      - send: cv
        assert: all_have_length(2) and has("测试")
      # gi 是空 AB，不能解释为声声二字词；继续输入辅键形成的 AUB 也暂时保留为空。
      - send: gi
        assert: "#cand == 0 and commit == nil"
      - send: gia
        assert: "#cand == 0 and commit == nil"
      - send: cvoa
        assert: has("测试") and not has("才是")
      - send: cvoi
        assert: has("才是") and not has("测试")
      # 各级主码候选均随新声韵映射重算：AUAU、AAA、AAAU、AAAA。
      - send: bqyv
        assert: has("冰雪")
      - send: vrf
        assert: has("输入法")
      - send: vrfa
        assert: has("输入法")
      - send: rgsn
        assert: has("人工智能")
      # cv、wy 都不是合法音节；cvwy 只能走 AAAA，不能混入二、三字前缀候选。
      - send: cvwy
        assert: has("测试一下") and not has("测试仪")
      # wi 是合法完整音节，cvwi 仍应走 AAAU 得到三字词。
      - send: cvwi
        assert: all_have_length(3) and has("测试仪")
      - send: dwybu
        assert: has("等一下")
      # ;/ 与 21×21 方案一致：顶出当前候选后追加“的/了”。
      - send: chvi;
        assert: commit == "测试的"
      - send: chvi/
        assert: commit == "测试了"
      # 「管理员」第二字形辅为 e；ye 是占用码，使用标准 AAAU+B 路由。
      - send: glwtu
        assert: has("管理员")
      - send: "bq,"
        assert: commit and commit:find("，", 1, true)
      - send: "bq."
        assert: commit and commit:find("。", 1, true)
  initial_hint_selection:
    tests:
      - send: "s2"
        assert: commit == "支持"
      # 六个空桶只在种类上顺延；第二页第一项为第六个桶 sb，不是同桶内的下一个词。
      - send: "s{Page_Down} "
        assert: commit == "这边"
  initial_pair_four_aux:
    tests:
      - send: cv
        assert: has("测试") and pair_comment("测试"):find("〔形₂₂₁₁ oa〕", 1, true)
      - send: cvo
        assert: has("测试") and pair_comment("测试"):find("〔形₂₂₁₁ aa〕", 1, true)
      - send: cvoa
        assert: has("测试") and pair_comment("测试"):find("〔形₂₂₁₁ aa〕", 1, true)
      - send: cvoaa
        assert: has("测试") and pair_comment("测试"):find("〔形₂₂₁₁ a〕", 1, true)
      - send: cvoaaa
        assert: has("测试") and not pair_comment("测试"):find("〔形₂₂₁₁", 1, true) and commit == nil
      - send: cvoaaa{BackSpace}
        assert: has("测试") and pair_comment("测试"):find("〔形₂₂₁₁ a〕", 1, true)
  initial_pair_reverse_policy:
    patch:
      translator/word_auxiliary_order: "21"
    tests:
      - send: cv
        assert: has("测试") and pair_comment("测试"):find("〔形₁₁₂₂ aa〕", 1, true)
      - send: cvaaoa
        assert: has("测试") and commit == nil
  initial_pair_learning:
    tests:
      # 先证明确实需要学习，再从四辅全码上屏，确认下一次短辅码首选前移。
      - send: cvo
        assert: (cand[1].text ~= "财神") or error(pair_probe())
      - send: cvoaao
        assert: (cand[2].text == "财神") or error(pair_probe())
      - send: "cvoaao2cvo"
        assert: (cand[1].text == "财神") or error(pair_probe())
