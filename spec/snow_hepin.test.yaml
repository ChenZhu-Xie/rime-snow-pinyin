schema: snow_hepin
source_dir: ..
script: |
  function rank(text)
    for index, candidate in ipairs(cand) do
      if candidate.text == text then return index end
    end
    return math.huge
  end
  function has(text)
    return rank(text) < math.huge
  end
  function page(text)
    return rank(text) <= 6
  end
  function hint_codes()
    local codes = {}
    for index = 2, #cand do
      if not cand[index].comment:match("^[a-z][a-z]$") then break end
      codes[#codes + 1] = cand[index].comment
    end
    return table.concat(codes, " ")
  end
  function comment(text)
    for _, candidate in ipairs(cand) do
      if candidate.text == text then return candidate.comment end
    end
    return ""
  end
  function all_have_length(length)
    if #cand == 0 then return false end
    for _, candidate in ipairs(cand) do
      if utf8.len(candidate.text) ~= length then return false end
    end
    return true
  end
  function page_length_count(length)
    local count = 0
    for index = 1, math.min(6, #cand) do
      if utf8.len(cand[index].text) == length then count = count + 1 end
    end
    return count
  end
  function pair_comment(text)
    for _, candidate in ipairs(cand) do
      if candidate.text == text then return candidate.comment end
    end
    return ""
  end
  function pair_probe()
    local parts = { "preedit=" .. tostring(preedit), "commit=" .. tostring(commit) }
    for index = 1, math.min(16, #cand) do
      parts[#parts + 1] = tostring(index) .. ":" .. cand[index].text .. "/" .. cand[index].comment
    end
    return table.concat(parts, " | ")
  end
deploy:
  sbs:
    tests:
      - send: rug
        assert: has("如果") and commit == nil
      - send: vaf
        assert: has("输入法") and commit == nil
      - send: vafiuu
        assert: cand[1].text == "输入法" and commit == nil
      - send: risnee
        assert: cand[1].text == "人工智能" and commit == nil
      - send: "vafiuu{BackSpace}u"
        assert: has("输入法") and commit == nil
      - send: "risnee{less}"
        assert: commit == "人工智能"
  sbs_learning:
    tests:
      - send: "vafiuu "
        assert: commit == "输入法"
      - send: vaf
        assert: cand[1].text == "输入法" and commit == nil
  adaptive_append_shi:
    tests:
      - send: "b]"
        assert: commit == "不是"
      - send: "bu]"
        assert: commit == "不是"
  short_shape_and_stroke_sources:
    tests:
      - send: jsii
        assert: commit == nil and cand[1].text == "尖"
      - send: xdeiu
        assert: commit == nil and cand[1].text == "尘"
  extended_single_strokes:
    tests:
      - send: "viaeieua"
        assert: commit == nil and cand[1].text == "势"
  word_length_selection:
    tests:
      - send: "rgsn{less}"
        assert: commit == "人工智能"
      - send: "jqji{greater}"
        assert: commit == "计算机"
      - send: "wyzr{greater}"
        assert: commit == "有限责任公司"
      # 不足四主码时沿用原有书名号行为。
      - send: "d{less}"
        assert: commit == "都《"
      # gi 是空桶；i 是三主码后的调辅，不能把物理四键当四主码。
      - send: ysgi
        assert: has("新中国") and commit == nil
      - send: "ysgi{less}"
        assert: commit ~= nil and commit:sub(-3) == "《"
      - send: "ysgi{greater}"
        assert: commit ~= nil and commit:sub(-3) == "》"
  long_words:
    tests:
      - send: kyfs
        assert: has("科学发展") and has("科学发展观") and commit == nil
      - send: kyfsG
        assert: (cand[1].text == "科学发展观" and commit == nil) or error(pair_probe())
      - send: shrmGHG
        assert: (cand[1].text == "中华人民共和国" and commit == nil) or error(pair_probe())
      - send: "kyfsG "
        assert: (commit == "科学发展观") or error(pair_probe())
      - send: kyfsGd
        assert: (commit == "科学发展观" and preedit == "d") or error(pair_probe())
  long_words_sentence:
    patch:
      'switches/@4/reset': 0
    tests:
      - send: kyfsG
        assert: (cand[1].text == "科学发展观" and commit == nil) or error(pair_probe())
  entry_contract:
    tests:
      # 生僻字补桶须为真实词典候选，不能只由 fixed 兜底造出同名候选。
      - send: cd
        assert: cand[1].text == "岑" and cand[1].comment:find("📌", 1, true)
      # 数字别名保留汉字首选；鹮道的 3 不得在重生成时再次丢失。
      - send: q
        assert: cand[1].text == "三" and cand[2].text == "3"
  traditional_entry_contract:
    options:
      traditionalization: true
    tests:
      - send: l
        assert: cand[1].text == "來"
  reverse_lookup:
    tests:
      # 部件全拼与笔画反查共用 u 入口，候选同时显示拼音。
      - send: "uwangyan"
        assert: page("琰") and cand[rank("琰")].comment:find("yan3", 1, true) ~= nil and commit == nil
      - send: "umaowenniao"
        assert: page("鹜") and cand[rank("鹜")].comment:find("wu4", 1, true) ~= nil and commit == nil
      # 单引号结束反查后可正常上屏，退格重输仍留在反查段。
      - send: "uwangyan' "
        assert: commit == "琰"
      - send: "uwangyan{BackSpace}n"
        assert: page("琰") and commit == nil
      # 共用入口不得破坏原有笔画反查。
      - send: ueiuoa
        assert: cand[1].text == "札"
  cross_route_user_phrase:
    tests:
      # 先证明空用户库中的短码首选不是“方案选单”，避免测试在未发生学习时假阳性。
      - send: fyyd
        assert: cand[1].text ~= "方案选单"
      # 用完整调辅码学习“方案选单”，动态码长随后会把它迁入四码短码并升为首选。
      - send: "fyydiu fyyd"
        assert: cand[1].text == "方案选单"
  buffered_command:
    tests:
      - send: o
        assert: cand[1].text == "📝 开启缓冲" and commit == nil
      - send: "o o"
        assert: cand[1].text == "📝 关闭缓冲" and commit == nil
      - send: "o o "
        assert: commit == nil and preedit == nil
  popping:
    tests:
      # RC26 的 qz、zq 都是声声空桶，不能保留 UM40 的 zen→zq 单字路径。
      - send: qz
        assert: all_have_length(2) and commit == nil
      - send: zq
        assert: all_have_length(2) and commit == nil
      # 每个声声空桶只取首选词；六个桶按词频排列，第二页先显示最后一桶，再按字频接单字。
      - send: s
        assert: cand[1].text == "这" and hint_codes() == "sx sw sz sv sr sb" and cand[2].text == "支持" and cand[7].text == "这边" and cand[8].text == "中" and cand[9].text == "着" and cand[10].text == "真" and cand[11].text == "只" and cand[12].text == "找" and cand[8].comment:find("〔声韵 sm〕", 1, true)
      # v 是声母；普通声韵桶 ve/vi 不得混入空桶提示。
      - send: v
        assert: cand[1].text == "是" and hint_codes() == "vv vw vr vm vz vx vb"
      # sr 未设固顶项，提示须与声声桶本身的首选一致；sm 有单字，不显示空桶提示。
      - send: sr
        assert: cand[1].text == "转让"
      - send: sm
        assert: cand[1].text == "中" and all_have_length(1)
      # 输入统计沿用公共 lua 前缀 o。
      - send: otj
        assert: cand[1].text == "📖 统计功能说明" and cand[2].text:match("^📊 ") ~= nil
      # RC26-39a5bfdc045342cd 换位后的一级固顶字。
      - send: d
        assert: cand[1].text == "都" and cand[1].comment:find("📌", 1, true) and not cand[2].comment:find("📌", 1, true)
      - send: p
        assert: cand[1].text == "跑"
      - send: j
        assert: cand[1].text == "我"
      # 占用桶保留汉字首选，字母固定为大写第 2、小写第 3。
      - send: bn
        assert: cand[1].text == "帮" and cand[2].text == "B" and cand[3].text == "b"
      # 单字定字：[ 重复该字，] 在该字后追加「是」
      - send: "j["
        assert: commit == "我我"
      - send: "j]"
        assert: (commit == "就是") or error("adaptive commit=" .. tostring(commit))
      - send: r
        assert: cand[1].text == "人"
      - send: z
        assert: cand[1].text == "在"
      # 合法 AU 不得混入同键位的声声二字词。
      - send: bq
        assert: all_have_length(1) and has("冰") and comment("冰"):find("〔调 io〕", 1, true) and preedit == "bq"
      # 冰 bing1 首 B=i（阴平），后续的 o/e 为前两笔（丶一）；调码归音节，笔画另入括号。
      - send: bqi
        assert: has("冰") and comment("冰"):find("〔调 oe〕", 1, true) and preedit == "bqi"
      - send: bqio
        assert: has("冰") and comment("冰"):find("〔调 ei〕", 1, true) and preedit == "bqi 笔[o]"
      # 四码顶的 AU→AUA 中间态不得把「测」顶屏；chvi 为「测试」。
      - send: chvi
        assert: commit == nil and has("测试") and preedit == "ch vi"
      - send: chvia
        assert: has("测试") and preedit == "cha vi"
      - send: chviaa
        assert: has("测试") and preedit == "cha via"
      # AU 空桶回退为声声二字词；按标准二字词辅序反向，先用第二字声调、首笔画筛选。
      - send: cv
        assert: all_have_length(2) and has("测试")
      # gi 是空 AB，不能解释为声声二字词；继续输入辅键形成的 AUB 也暂时保留为空。
      - send: gi
        assert: "#cand == 0 and commit == nil"
      - send: gia
        assert: "#cand == 0 and commit == nil"
      - send: cva
        assert: has("测试") and not has("措施") and not has("财神")
      - send: cve
        assert: has("财神") and not has("才是") and not has("测试")
      # 各级主码候选均随新声韵映射重算：AUAU、AAA、AAAU、AAAA。
      - send: bqyv
        assert: has("冰雪")
      - send: vrf
        assert: has("输入法")
      - send: vrfa
        assert: has("输入法")
      - send: rgsn
        assert: has("人工智能")
      # wywp 同时容纳「由于」「优先于」「婴儿用品」等候选；跨词长分层排序，首页各取两个二、三、四字词。
      - send: wywp
        assert: page_length_count(2) == 2 and page_length_count(3) == 2 and page_length_count(4) == 2
      - send: fyydiu
        assert: cand[1].text == "方案选单"
      # cv、wy 都不是合法音节；cvwy 只能走 AAAA，不能混入二、三字前缀候选。
      - send: cvwy
        assert: has("测试一下") and not has("测试仪")
      # wi 是合法完整音节，cvwi 仍应走 AAAU 得到三字词。
      - send: cvwi
        assert: all_have_length(3) and has("测试仪")
      # yr 是合法的 xia 音节；dwybi 走标准 AAAU+B2，调辅给出第二字一声。
      - send: dwybi
        assert: has("等一下")
      # ;/ 与 21×21 方案一致：顶出当前候选后追加“的/了”。
      - send: chvi;
        assert: commit == "测试的"
      - send: chvi/
        assert: commit == "测试了"
      # 第三音节的 yu 空桶可把第二字三声辅键 u 前移，ykyu 是 AAA+B 的可选短码。
      - send: wkwiu
        assert: has("也可以")
      - send: bqioe
        assert: has("冰")
      # 部首冫的三拼部首码以 b 开头；数字 1 与声调、笔画互不混淆。
      - send: "bqi1b"
        assert: has("冰")
      - send: "bqi1x"
        assert: not has("冰")
  initial_hint_selection:
    tests:
      - send: "s2"
        assert: commit == "支持"
      - send: "s{Page_Down} "
        assert: commit == "这边"
  initial_pair_four_aux:
    tests:
      - send: cv
        assert: has("才睡") and pair_comment("才睡"):find("〔调笔₂₂₁₁ ai〕", 1, true)
      - send: cva
        assert: has("才睡") and pair_comment("才睡"):find("〔调笔₂₂₁₁ ie〕", 1, true)
      - send: cvai
        assert: has("才睡") and pair_comment("才睡"):find("〔调笔₂₂₁₁ ee〕", 1, true)
      - send: cvaie
        assert: has("才睡") and pair_comment("才睡"):find("〔调笔₂₂₁₁ e〕", 1, true)
      - send: cvaiee
        assert: has("才睡") and not pair_comment("才睡"):find("〔调笔₂₂₁₁", 1, true) and commit == nil
      - send: cvaiee{BackSpace}
        assert: has("才睡") and pair_comment("才睡"):find("〔调笔₂₂₁₁ e〕", 1, true)
  initial_pair_reverse_policy:
    patch:
      translator/word_auxiliary_order: "21"
    tests:
      - send: cv
        assert: has("才睡") and pair_comment("才睡"):find("〔调笔₁₁₂₂ ee〕", 1, true)
      - send: cveeai
        assert: has("才睡") and commit == nil
  initial_pair_learning:
    tests:
      # 先证明确实需要学习，再从四辅全码上屏，确认下一次短辅码首选前移。
      - send: cva
        assert: (cand[1].text ~= "才睡") or error(pair_probe())
      - send: cvaiee
        assert: (cand[1].text == "才睡") or error(pair_probe())
      - send: "cvaiee cva"
        assert: (cand[1].text == "才睡") or error(pair_probe())
