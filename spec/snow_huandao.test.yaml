schema: snow_huandao
source_dir: ..
script: |
  function rank(text)
    for index, candidate in ipairs(cand) do
      if candidate.text == text then return index end
    end
    return math.huge
  end
  function has(text) return rank(text) < math.huge end
  function page(text) return rank(text) <= 6 end
  function comment(text) return has(text) and cand[rank(text)].comment or "" end
  function append_order(key, remember)
    local texts = {}
    for index, candidate in ipairs(cand) do texts[index] = candidate.text end
    local value = table.concat(texts, "|")
    append_orders = append_orders or {}
    if remember then append_orders[key] = value; return true end
    return value == append_orders[key]
  end
  function remember_top()
    six_code_top = cand[1].text
    return true
  end
  function pair_probe()
    local parts = { "preedit=" .. tostring(preedit), "commit=" .. tostring(commit) }
    for index = 1, math.min(16, #cand) do
      parts[#parts + 1] = tostring(index) .. ":" .. cand[index].text .. "/" .. cand[index].comment
    end
    return table.concat(parts, " | ")
  end
deploy:
  sbs:
    tests:
      - send: rug
        assert: has("如果") and commit == nil
      - send: vuf
        assert: has("输入法") and commit == nil
      - send: vufeoa
        assert: cand[1].text == "输入法" and commit == nil
      - send: rexn
        # 与二字词混排；四字词类内首选由下方 < 上屏断言验证。
        assert: page("人工智能") and commit == nil
      # 四码已是首选，继续补辅沿用首选后置；仍须保留符合辅码的目标。
      - send: rexnia
        assert: has("人工智能") and commit == nil
      - send: "vufeoa{BackSpace}a"
        assert: has("输入法") and commit == nil
      - send: "rexn{less}"
        assert: commit == "人工智能"
  sbs_learning:
    tests:
      - send: "vufeoa "
        assert: commit == "输入法"
      - send: vuf
        assert: cand[1].text == "输入法" and commit == nil
  adaptive_append_selected_word:
    tests:
      - send: "dj"
        assert: cand[1].text == "大家"
      - send: "dj]"
        assert: commit == "家"
  adaptive_append_readonly:
    tests:
      - send: "bhvk"
        assert: append_order("full", true)
      - send: "bv"
        assert: append_order("short", true)
      - send: "b]b]b]bhvk"
        assert: commit == "不是不是不是" and append_order("full", false)
      - send: "bv"
        assert: append_order("short", false)
  adaptive_append_shi:
    tests:
      - send: "b]"
        assert: commit == "不是"
      - send: "bh]"
        assert: commit == "不是"
  short_shape_and_stroke_sources:
    tests:
      # 单字 ] 追加「是」，[ 仍重复单字。
      - send: "b]"
        assert: commit == "不是"
      - send: "b["
        assert: commit == "不不"
      - send: jouaa
        assert: commit == nil and cand[1].text == "几"
  word_length_selection:
    tests:
      - send: "rgxn{less}"
        assert: commit == "人工智能"
      - send: "jsjz{greater}"
        assert: commit == "计算机"
      # ly 是空桶，四码时无三字路由，兜底五字及以上补全。
      - send: "gfly{Shift+period}"
        assert: commit == "股份有限公司"
      # 不足四主码时沿用原有书名号行为。
      - send: "d{less}"
        assert: commit == "都《"
  long_words:
    tests:
      - send: kyfx
        assert: has("科学发展观") and commit == nil
      - send: kyfxG
        assert: (cand[1].text == "科学发展观" and commit == nil) or error(pair_probe())
      - send: xhrmGHG
        assert: (cand[1].text == "中华人民共和国" and commit == nil) or error(pair_probe())
      - send: "kyfxG "
        assert: (commit == "科学发展观") or error(pair_probe())
      - send: kyfxGd
        assert: (commit == "科学发展观" and preedit == "d") or error(pair_probe())
  long_words_sentence:
    patch:
      'switches/@4/reset': 0
    tests:
      - send: kyfxG
        assert: (cand[1].text == "科学发展观" and commit == nil) or error(pair_probe())
  entry_contract:
    tests:
      # 生僻字补桶须为真实词典候选，不能只由 fixed 兜底造出同名候选。
      - send: sjo
        assert: cand[1].text == "㬚" and cand[1].comment:find("📌", 1, true)
      # 数字别名保留汉字首选；鹮道的 3 不得在重生成时再次丢失。
      - send: sm
        assert: cand[1].text == "三" and cand[2].text == "S" and cand[3].text == "s" and cand[4].text == "3"
  traditional_entry_contract:
    options:
      traditionalization: true
    tests:
      - send: w
        assert: cand[1].text == "來"
  popping:
    tests:
      - send: jnse
        assert: cand[1].text == "经常" and commit == nil
      - send: jnsei
        assert: cand[1].text == "精髓" and rank("经常") == 2 and commit == nil
      # 与评测的无学习冷态候选一致；不能把第五候选当作首选短码。
      - send: yvd
        assert: cand[1].text == "形式的" and rank("新时代") > 1 and commit == nil
      - send: yvdho
        assert: (cand[1].text == "新时代" and commit == nil) or error(pair_probe())
      # 固顶只检查一例；字母入口按鹮道的实际占用桶重新选择。
      - send: p
        assert: cand[1].text == "我"
      - send: bm
        assert: cand[2].text == "B" and cand[3].text == "b"
      # 固顶兜底按实际读音权重；尿的 niào 高频不能抬高其 suī 异读。
      - send: sx
        assert: cand[1].text == "吹" and has("虽") and has("尿")
      # 同一韵组由声调决定第二码；后置形辅不再输入声调。
      - send: bn
        assert: has("冰") and preedit == "bn"
      - send: bno
        assert: cand[1].text == "冰" and cand[1].comment:find("📌", 1, true) and preedit == "bn 形[o]"
      # 第二码已包含声调；继续补形辅仍可找到「冰」，三级固顶标记不沿用到四码。
      - send: bnoe
        assert: has("冰") and not comment("冰"):find("📌", 1, true) and preedit == "bn 形[oe]" and commit == nil
      - send: br
        assert: has("饼")
      - send: bl
        assert: has("病")
      # 词语主码仍为 AUAU / AAA / AAAU / AAAA。
      - send: cjvk
        assert: has("测试") and commit == nil and preedit == "cj vk"
      - send: bnyweo
        assert: has("冰雪") and commit == nil
      - send: vrf
        assert: has("输入法")
      - send: vrfp
        assert: has("输入法") and commit == nil
      - send: vrfpeu
        assert: has("输入法") and preedit == "v r fp 形[eu]" and commit == nil
      # ko 是空桶，三字词第四码 o 直接进入 AAA+B 的形辅回收路由。
      - send: vjkoi
        assert: has("数据库") and commit == nil
      - send: rgxneu
        assert: has("人工智能") and commit == nil
      # 原有单字桶不得被声声回收；ko 的第二码是辅键，不能回收成二字词。
      - send: cv
        assert: has("粗") and not has("测试")
      - send: ko
        assert: "#cand == 0 and commit == nil"
      # 空桶提示与当前声声桶首选保持一致。
      - send: f
        assert: cand[1].text == "发" and cand[2].text == "负责" and cand[2].comment == "fz"
      - send: "cjvk;"
        assert: commit == "测试的"
      - send: "cjvk/"
        assert: commit == "测试了"
  learned_postponement:
    tests:
      - send: "jnse jnse"
        assert: cand[1].text == "经常"
      - send: jnsei
        assert: cand[1].text == "精髓" and rank("经常") == 2 and commit == nil
      - send: jnsei{BackSpace}
        assert: cand[1].text == "经常" and commit == nil
      - send: jnsei{BackSpace}i
        assert: cand[1].text == "精髓" and rank("经常") == 2 and commit == nil
  initial_pair_four_aux:
    tests:
      # bd 空桶：「不」的前两辅 eu，然后「到」的前两辅 ea，逐字逐字追加。
      - send: bd
        assert: has("不到") and comment("不到"):find("〔形₁₁₂₂ eu〕", 1, true) ~= nil
      - send: bde
        assert: has("不到") and commit == nil
      - send: bdeu
        assert: has("不到") and comment("不到"):find("〔形₁₁₂₂ ea〕", 1, true) ~= nil
      - send: bdeue
        assert: has("不到") and commit == nil
      - send: bdeuea
        assert: has("不到") and not comment("不到"):find("〔形₁₁₂₂", 1, true) and commit == nil
      - send: bdeuea{BackSpace}
        assert: has("不到") and comment("不到"):find("〔形₁₁₂₂ a〕", 1, true) ~= nil
  six_code_popping:
    tests:
      # 四辅全码可能仍有重码；应顶出这个码的实际首选，而非固定某个词。
      - send: bdeuea
        assert: has("不到") and remember_top()
      - send: bdeueab
        assert: (commit == six_code_top and preedit == "b") or error("top=" .. tostring(six_code_top) .. ", commit=" .. tostring(commit) .. ", preedit=" .. tostring(preedit))
  initial_pair_reverse_policy:
    patch:
      translator/word_auxiliary_order: "12"
    tests:
      - send: bd
        assert: has("不到") and comment("不到"):find("〔形₂₂₁₁ ea〕", 1, true) ~= nil
      - send: bdeaeu
        assert: has("不到") and commit == nil
  initial_pair_learning:
    tests:
      # 「报答」在 bdiu 桶不是首选，六码 bdiuue 在当前词库中唯一。
      - send: bdiu
        assert: has("报答") and cand[1].text ~= "报答"
      - send: bdiuue
        assert: cand[1].text == "报答"
      # bd 固顶「不到」不能被学习权重覆盖；在未固顶的 bdi 取首选后停止补辅。
      - send: "bdiuue bdi"
        assert: (cand[1].text == "报答" and commit == "报答") or error("first=" .. tostring(cand[1].text) .. ", commit=" .. tostring(commit))
      - send: bd
        assert: cand[1].text == "不到" and has("报答") and commit == nil
      - send: bdiu
        assert: cand[1].text ~= "报答" and has("报答") and commit == nil
  reverse_lookup:
    tests:
      - send: uwangyan
        assert: page("琰") and comment("琰"):find("yan3", 1, true) ~= nil
      - send: ueiuoa
        assert: cand[1].text == "札"
  buffered_command:
    tests:
      - send: o
        assert: cand[1].text == "📝 开启缓冲"
      - send: otj
        assert: cand[1].text == "📖 统计功能说明"
