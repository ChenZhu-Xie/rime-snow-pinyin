name: 单字限额候选验证
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --cwd scripts --frozen-lockfile
      - name: 核对生产版本和输入预算
        run: |
          mkdir -p output/budgeted
          cp scripts/data/character-budgeted-probes.json output/budgeted/input.json
          bun -e 'import {readFileSync} from "node:fs"; import assert from "node:assert/strict"; import {spawnSync} from "node:child_process"; const input=JSON.parse(readFileSync("output/budgeted/input.json","utf8")); assert.equal(spawnSync("git",["diff","--exit-code",input.productionRevision,"--","lua","deps","snow_*.yaml","snow_*.txt"]).status,0); for(const entry of Object.values(input.schemas)){const codes=new Set(entry.codes); assert.ok(codes.size<=input.perSchemaBudget); for(const code of codes) for(let n=1;n<=code.length;n++)assert.ok(codes.has(code.slice(0,n)));} '
      - name: 准备发布运行时
        run: |
          sudo apt-get update
          sudo apt-get install --yes opencc
          mkdir -p opencc
          cp /usr/share/opencc/* opencc/
          curl --fail --location --retry 3 --output mira https://github.com/rimeinn/mira/releases/download/latest/mira-rime1.17
          chmod +x mira
          sha256sum mira > output/budgeted/runtime.sha256
      - name: 串行采集空词典候选
        run: /usr/bin/time -v bun scripts/probe-character-first-choice.ts --cases output/budgeted/input.json --default-only --no-trace --runtime release-independent-prefixes --mira ./mira --output output/budgeted/results
      - name: 核对全部前缀并审计预测
        run: bun scripts/audit-character-conflict-probes.ts output/budgeted
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-budgeted-probes
          path: |
            output/budgeted/input.json
            output/budgeted/runtime.sha256
            output/budgeted/audit.json
            output/budgeted/results/manifest.json
            output/budgeted/results/observations.jsonl
            output/budgeted/results/**/mira.log
