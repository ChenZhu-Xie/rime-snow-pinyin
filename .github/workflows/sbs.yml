name: SBS 定向验证

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbs:
    name: ${{ matrix.schema }} / ${{ matrix.runtime }} / SBS
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        schema: [snow_hedao, snow_hepin, snow_huandao]
        runtime: [mira-rime1.13.1, mira-rime1.17]
    steps:
      - name: 获取代码与部件依赖
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: 准备测试环境
        run: |
          sudo apt-get update
          sudo apt-get install --yes opencc lua5.4
          cp spec/fixtures/default.yaml default.yaml
          mkdir -p opencc
          cp /usr/share/opencc/* opencc/
          cp deps/rime-radical-pinyin/radical_pinyin.{schema,dict}.yaml .
      - name: 检查声辅声与相关共用逻辑
        run: |
          lua5.4 spec/sbs.test.lua
          lua5.4 spec/sbs_query.test.lua
          lua5.4 spec/learned_priority.test.lua
          lua5.4 spec/shenyun-prefix-query.test.lua
          lua5.4 spec/shenyun-longwords.test.lua
          lua5.4 spec/select_word_length.test.lua
          lua5.4 spec/code_navigator.test.lua
          lua5.4 spec/zhudao-navigation.test.lua
      - name: 获取指定 Mira 资产
        env:
          MIRA_ASSET: ${{ matrix.runtime }}
        run: |
          curl --fail --location --retry 3 -o mira "https://github.com/rimeinn/mira/releases/download/latest/$MIRA_ASSET"
          chmod +x mira
          sha256sum mira
      - name: 只验证新增 SBS 场景与学习
        env:
          TARGET_SCHEMA: ${{ matrix.schema }}
        run: ./mira -C build -R '^sbs(_learning)?$' "spec/$TARGET_SCHEMA.test.yaml"
