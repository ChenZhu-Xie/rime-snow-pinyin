name: 功能与词典检查

on:
  workflow_call:
    inputs:
      schema:
        description: 只测试指定 schema_id；留空则测试全部方案
        required: false
        type: string
        default: ''
      deploy:
        description: 只运行指定 deploy；留空则运行全部场景
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      schema:
        description: 只测试指定 schema_id；留空则测试全部方案
        required: false
        type: string
      deploy:
        description: 只运行指定 deploy；留空则运行全部场景
        required: false
        type: string

permissions:
  contents: read

jobs:
  dictionary:
    name: 脚本、词典与版本检查
    runs-on: ubuntu-24.04
    steps:
      - name: 获取代码
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: 安装脚本依赖
        run: bun install --cwd scripts --frozen-lockfile
      - name: 核对全部版本号
        run: bun scripts/version.ts --check
      - name: 检查发布脚本
        run: bun test scripts/benchmark-latency.test.ts scripts/version.test.ts scripts/workflows.test.ts
      - name: 检查方案菜单覆盖与快捷键
        run: bun test scripts/fixed-corpus/test/scheme-regressions.test.ts
      - name: 检查九个方案的全部拼音音节编码
        run: bun scripts/check-pinyin-dict.ts
      - name: 检查声声二字词辅序与提示
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.4
          lua5.4 spec/initial_pair_aux.test.lua
          lua5.4 spec/initial_pair_query.test.lua
          lua5.4 spec/zhudao-navigation.test.lua
          lua5.4 spec/code_navigator.test.lua
          lua5.4 spec/jiandao-toned-shape.test.lua
          lua5.4 spec/ued-shape.test.lua
          lua5.4 spec/shenyun-prefix-query.test.lua
          lua5.4 spec/shenyun-longwords.test.lua
          lua5.4 spec/abbreviation-longwords.test.lua
          lua5.4 spec/select_word_length.test.lua
          lua5.4 spec/candidate_priority.test.lua
          lua5.4 spec/learned_priority.test.lua
          lua5.4 spec/postpone-learning.test.lua
          lua5.4 spec/postpone-longwords.test.lua
          lua5.4 spec/simplified.test.lua
          lua5.4 spec/shenyun_hint.test.lua
          lua5.4 spec/schema_menu.test.lua
          lua5.4 spec/keymap.test.lua

  validate-shenyun:
    name: 核验神韵双拼映射
    runs-on: ubuntu-24.04
    steps:
      - name: 获取代码
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: 安装校验依赖
        working-directory: scripts
        run: bun install --frozen-lockfile
      - name: 批量核验映射和固顶词
        run: |
          bun scripts/generate-layout-algebra.ts --check
          bun scripts/generate-jiandao-toned.ts --check
          bun test --cwd scripts fixed-corpus/test/jiandao-toned.test.ts
          bun scripts/generate-zhudao.ts --check
          bun test --cwd scripts fixed-corpus/test/zhudao.test.ts
          bun test --cwd scripts fixed-corpus/test/character-reading-priorities.test.ts
          bun scripts/research/calculate_shenyun_21x26_letter_buckets.ts --zhudao --check
          bun scripts/align-fixed-with-sipin.ts --check
          bun scripts/生成神韵映射.ts --check
          bun test --cwd scripts fixed-corpus/test/ued-layout.test.ts
          bun scripts/生成神韵固顶词.ts --check
          bun scripts/生成三拼简词.ts --check
          bun scripts/generate-shenyun-hints.ts --check
          bun scripts/验证神韵双拼.ts

  keymaps:
    name: 键位图桌面 helper 与移动皮肤（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 获取代码
        uses: actions/checkout@v4
      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: 安装脚本依赖
        run: bun install --cwd scripts --frozen-lockfile
      - name: 检查移动皮肤
        run: |
          bun run --cwd scripts typecheck
          bun test --cwd scripts fixed-corpus/test/keymaps.test.ts
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
      - name: 检查桌面 helper
        run: cargo test --locked --manifest-path tools/keymap-helper/Cargo.toml
      - name: 编译桌面 helper
        if: runner.os != 'macOS'
        run: cargo build --release --locked --manifest-path tools/keymap-helper/Cargo.toml
      - name: 编译并校验 macOS 双架构 helper
        if: runner.os == 'macOS'
        run: bash tools/keymap-helper/build-macos.sh
      - name: 安装 Linux 桌面测试环境
        id: linux-desktop
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb openbox xdotool x11-utils fonts-noto-cjk weston libxkbcommon-x11-0
      - name: 检查 Linux X11 首次启动与显隐
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s '-screen 0 1600x1000x24' sh -c '
            openbox >/tmp/snow-openbox.log 2>&1 &
            trap "kill $!" EXIT
            sleep 1
            env -u WAYLAND_DISPLAY python3 tools/keymap-helper/tests/unix-launch.py --helper tools/keymap-helper/target/release/snow-keymap --output output/keymap-desktop/x11
          '
      - name: 检查原生 Wayland 隐藏与缓存重开
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.linux-desktop.outcome == 'success' }}
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          weston --backend=headless-backend.so --socket=snow-keymap-test --idle-time=0 --log="$XDG_RUNTIME_DIR/weston.log" &
          weston_pid=$!
          trap 'kill "$weston_pid"' EXIT
          for attempt in $(seq 1 100); do
            test ! -S "$XDG_RUNTIME_DIR/snow-keymap-test" || break
            sleep 0.1
          done
          env -u DISPLAY WAYLAND_DISPLAY=snow-keymap-test python3 tools/keymap-helper/tests/unix-launch.py --wayland --helper tools/keymap-helper/target/release/snow-keymap --output output/keymap-desktop/wayland
      - name: 检查 macOS 首次启动、定位与焦点
        if: runner.os == 'macOS'
        run: python3 tools/keymap-helper/tests/unix-launch.py --helper tools/keymap-helper/target/universal/snow-keymap --output output/keymap-desktop/macos
      - name: 检查 Windows 原生启动与首次定位
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/keymap-helper/tests/windows-launch.ps1
      - name: 保存桌面启动测量
        if: always() && runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: keymap-desktop-${{ matrix.os }}
          path: output/keymap-desktop/
          if-no-files-found: warn

  test:
    name: ${{ matrix.scheme.name }} / librime ${{ matrix.runtime.version }}
    needs: [dictionary, validate-shenyun, keymaps]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - version: 1.13.1
            asset: mira-rime1.13.1
          - version: '1.17'
            asset: mira-rime1.17
        scheme:
          - name: 冰雪四拼
            schema: snow_sipin
          - name: 冰雪兰拼
            schema: snow_sanpin
          - name: 冰雪一拼
            schema: snow_yipin
          - name: 冰雪兰道
            schema: snow_jiandao
          - name: 冰雪清韵
            schema: snow_qingyun
          - name: 冰雪鹤道
            schema: snow_shenyun_shape
          - name: 冰雪鹤拼
            schema: snow_shenyun_tone
          - name: 冰雪键道
            schema: snow_jiandao_classic
          - name: 冰雪三拼
            schema: snow_sanpin_classic
          - name: 冰雪莲道
            schema: snow_jiandao_toned
          - name: 冰雪鹮道
            schema: snow_zhudao
    steps:
      - name: 获取代码
        if: inputs.schema == '' || inputs.schema == matrix.scheme.schema
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: 准备方案依赖
        if: inputs.schema == '' || inputs.schema == matrix.scheme.schema
        run: |
          cp spec/fixtures/default.yaml default.yaml
          sudo apt-get update
          sudo apt-get install --yes opencc
          mkdir -p opencc
          cp /usr/share/opencc/* opencc/
      - name: 安装 Mira（librime ${{ matrix.runtime.version }}）
        if: inputs.schema == '' || inputs.schema == matrix.scheme.schema
        run: |
          wget -O mira https://github.com/rimeinn/mira/releases/download/latest/${{ matrix.runtime.asset }}
          chmod +x mira
          sha256sum mira
      - name: ${{ matrix.scheme.name }}
        if: inputs.schema == '' || inputs.schema == matrix.scheme.schema
        env:
          MIRA_DEPLOY: ${{ inputs.deploy }}
        run: |
          cp deps/rime-radical-pinyin/radical_pinyin.{schema,dict}.yaml .
          if [[ -n "$MIRA_DEPLOY" ]]; then
            ./mira -C build -R "^${MIRA_DEPLOY}$" spec/${{ matrix.scheme.schema }}.test.yaml
          else
            ./mira -C build spec/${{ matrix.scheme.schema }}.test.yaml
          fi
