name: 追加字对照实验
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        schema: [snow_sipin, snow_jiandao, snow_sanpin, snow_shenyun_shape, snow_shenyun_tone, snow_jiandao_toned, snow_zhudao, snow_jiandao_classic, snow_sanpin_classic]
    steps:
      - uses: actions/checkout@v4
        with:
          path: tooling
      - uses: actions/checkout@v4
        with:
          ref: 27019df92c87dbdbed52da18f9ded7d8bf5ac031
          submodules: true
          path: source
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --cwd tooling/scripts --frozen-lockfile
      - name: 准备固定来源的发布运行时
        run: |
          sudo apt-get update
          sudo apt-get install --yes opencc
          mkdir -p source/opencc output
          cp /usr/share/opencc/* source/opencc/
          curl --fail --location --retry 3 --output mira https://github.com/rimeinn/mira/releases/download/latest/mira-rime1.17
          chmod +x mira
          sha256sum mira > output/runtime.sha256
      - name: 空白词典串行比较现行了与候选与和在
        run: bun tooling/scripts/experiments/probe-append-characters.ts --source source --cases tooling/scripts/data/append-character-probes.json --schema '${{ matrix.schema }}' --mira ./mira --output 'output/${{ matrix.schema }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: append-${{ matrix.schema }}
          path: |
            output/runtime.sha256
            output/**/summary.json
            output/**/observations.jsonl
            output/**/probe.test.yaml
            output/**/mira.log
