name: 清韵上游行为诊断

on:
  workflow_dispatch:

jobs:
  qingyun:
    name: 上游冰雪清韵
    runs-on: ubuntu-24.04
    steps:
      - name: 获取代码
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: 安装 Mira
        run: |
          wget -O mira https://github.com/rimeinn/mira/releases/download/latest/mira
          chmod +x mira
      - name: 测试清韵反查相关行为
        run: |
          cp deps/rime-radical-pinyin/radical_pinyin.{schema,dict}.yaml .
          ./mira -C build -R '^(upstream_wangyan_order|advanced|shape_g|shape_t|shape_none)$' spec/snow_qingyun.test.yaml
