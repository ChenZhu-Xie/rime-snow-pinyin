on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: 覆盖附件的既有 Release 标签（标签本身不会移动）
        required: true
        type: string

name: 发布

permissions:
  contents: write

jobs:
  functional:
    name: 发布前功能门禁
    uses: ./.github/workflows/functional.yml
  latency:
    name: 发布前性能门禁
    uses: ./.github/workflows/latency.yml
  keymap-helper:
    name: 键位图 helper（${{ matrix.platform }}）
    strategy:
      matrix:
        include:
          - platform: Windows x64
            os: windows-2025
            output: snow-keymap-windows.exe
          - platform: macOS x64
            os: macos-15-intel
            output: snow-keymap-macos
          - platform: Linux x64
            os: ubuntu-22.04
            output: snow-keymap-linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: 获取代码
        uses: actions/checkout@v7
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
      - name: 编译
        run: cargo build --release --locked --manifest-path tools/keymap-helper/Cargo.toml
      - name: 整理 Windows 产物
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path helper-dist | Out-Null
          Copy-Item tools/keymap-helper/target/release/snow-keymap.exe "helper-dist/${{ matrix.output }}"
      - name: 整理 Unix 产物
        if: runner.os != 'Windows'
        run: |
          mkdir -p helper-dist
          cp tools/keymap-helper/target/release/snow-keymap "helper-dist/${{ matrix.output }}"
          chmod +x "helper-dist/${{ matrix.output }}"
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: keymap-helper-${{ runner.os }}
          path: helper-dist/*
          if-no-files-found: error
  build:
    name: 发布
    needs: [functional, latency, keymap-helper]
    runs-on: ubuntu-26.04
    steps:
      - name: 获取代码
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: 下载键位图 helper
        uses: actions/download-artifact@v5
        with:
          pattern: keymap-helper-*
          path: lua/snow/bin
          merge-multiple: true
      - name: 恢复 Unix helper 执行权限
        run: chmod +x lua/snow/bin/snow-keymap-macos lua/snow/bin/snow-keymap-linux
      - name: 安装 Rime 输入法用于编译
        run: sudo apt install -y --no-install-recommends librime-bin rime-prelude
      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: 核对发布标签和全部版本号
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: bun scripts/version.ts --check "$RELEASE_VERSION"
      - name: 打包用户安装包
        run: |
          cp deps/rime-radical-pinyin/radical_pinyin.{schema,dict}.yaml .
          zip -r snow-pinyin.zip snow_* radical_pinyin.*.yaml lua
      - name: 安装皮肤生成依赖
        run: bun install --cwd scripts --frozen-lockfile
      - name: 检查九个发布方案的全部拼音音节编码
        run: bun scripts/check-pinyin-dict.ts
      - name: 生成并打包皮肤
        run: |
          bun scripts/generate-skins.ts skins
          (cd skins/hamster && zip -r ../../snow-pinyin-skins-hamster.zip .)
          (cd skins/trime && zip -r ../../snow-pinyin-skins-trime.zip .)
      - name: 预览安装包去掉腾讯词库和笔画
        run: |
          # rime-prelude 自带 default.yaml，仓库的 default.yaml 会被部署器当作过时副本移进 trash/
          echo -e "patch:\n  schema_list:\n    - { schema: snow_sipin }\n    - { schema: snow_sanpin }\n    - { schema: snow_sanpin_first }\n    - { schema: snow_yipin }\n    - { schema: snow_jiandao }\n    - { schema: snow_jiandao_first }\n    - { schema: snow_qingyun }\n    - { schema: snow_shenyun_shape }\n    - { schema: snow_shenyun_shape_first }\n    - { schema: snow_shenyun_tone }\n    - { schema: snow_shenyun_tone_first }\n    - { schema: snow_jiandao_classic }\n    - { schema: snow_sanpin_classic }" > default.custom.yaml
          sed -i -E '/^ *- snow_pinyin\.tencent$/d' snow_*.schema.yaml
          # 部件反查共用 stroke 段，保留入口和分段器，只移除笔画词库与翻译器。
          sed -i -E '/^ *- (snow_bihua|snow_jiandao_bihua|table_translator@stroke|lua_filter@\*snow\.bihua(\*filter)?)$/d' snow_*.schema.yaml
      - name: 编译
        run: rime_deployer --build . /usr/share/rime-data/
      - name: 打包预览安装包
        run: |
          zip -r snow-pinyin-build.zip build lua *.txt
      - name: 读取标签中的发布说明
        if: github.event_name == 'push'
        run: git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > release-notes.md
      - name: 发布
        if: github.event_name == 'push'
        uses: comnoco/create-release-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: 冰雪拼音 ${{ github.ref_name }}
          body_path: release-notes.md
      - name: 上传
        if: github.event_name == 'push'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "*.zip"
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true
      - name: 覆盖指定 Release 的附件
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          gh release upload "$RELEASE_TAG" ./*.zip --repo "$GITHUB_REPOSITORY" --clobber
