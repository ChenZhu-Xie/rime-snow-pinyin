name: 性能

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      schema:
        description: 单独复测的 schema_id（留空执行完整门禁）
        type: string
        default: ""
      case:
        description: 单独复测的场景正则（需同时指定方案）
        type: string
        default: "^initial-pair-four-aux$"
      profile_append:
        description: 记录前两次自适应上屏的分路线 CPU 耗时（诊断运行）
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  latency:
    name: 按键反馈统一延迟预算
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 获取方案代码
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: 获取固定版本 librime 1.17.0
        uses: actions/checkout@v4
        with:
          repository: rime/librime
          ref: 33e78140250125871856cdc5b42ddc6a5fcd3cd4
          path: output/latency-runtime/librime
          persist-credentials: false
      - name: 获取固定版本 librime-lua
        uses: actions/checkout@v4
        with:
          repository: hchunhui/librime-lua
          ref: 68f9c364a2d25a04c7d4794981d7c796b05ab627
          path: output/latency-runtime/librime/plugins/lua
          persist-credentials: false
      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ pkg-config libboost-regex-dev libgoogle-glog-dev libgflags-dev libleveldb-dev libmarisa-dev libopencc-dev libyaml-cpp-dev liblua5.4-dev
      - name: 构建带 Lua 的控制台
        run: |
          cmake -S output/latency-runtime/librime -B output/latency-runtime/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TEST=OFF -DBUILD_MERGED_PLUGINS=ON -DENABLE_EXTERNAL_PLUGINS=OFF -DLUA_VERSION=lua5.4
          cmake --build output/latency-runtime/build --target rime_api_console --parallel 2
      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: 安装脚本依赖
        run: bun install --cwd scripts --frozen-lockfile
      - name: 准备 OpenCC 共享数据
        run: |
          mkdir -p output/latency-runtime/librime/data/minimal/opencc
          cp -a /usr/share/opencc/. output/latency-runtime/librime/data/minimal/opencc/
      - name: 检查统一性能预算
        env:
          TARGET_SCHEMA: ${{ inputs.schema }}
          TARGET_CASE: ${{ inputs.case }}
          SNOW_APPEND_PROFILE: ${{ inputs.profile_append && '1' || '' }}
        run: |
          args=(--ci)
          if [ -n "$TARGET_SCHEMA" ]; then
            args=("$TARGET_SCHEMA" --case "$TARGET_CASE" --rounds 200 --max-p99-ms 50)
            printf '本次为指定场景复测，不代替完整性能门禁。\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          bun scripts/benchmark-latency.ts "${args[@]}" --console output/latency-runtime/build/bin/rime_api_console --shared-data output/latency-runtime/librime/data/minimal --output-dir output/latency-ci
      - name: 展示性能结果
        if: always()
        run: |
          if [ '${{ inputs.profile_append }}' = 'true' ]; then
            printf '诊断运行启用了分路线计时，不作为正式延迟结果。\n' >> "$GITHUB_STEP_SUMMARY"
            rg 'append_shi profile' output/latency-ci/ || true
          fi
          if [ -f output/latency-ci/report.json ]; then
            bun scripts/summarize-latency.ts output/latency-ci/report.json >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## 按键反馈延迟\n\n❌ 未生成性能报告，请查看本次运行的测试与构建日志。\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: 保留性能报告与失败日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latency-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/latency-ci/
          retention-days: 14
