on:
  push:
    branches:
      - '**'
    # 只有已实装的 Rime 方案、候选测试、门禁或其生成输入变化时才运行。
    paths:
      - 'snow_*'
      - 'lua/**'
      - 'opencc/**'
      - 'spec/**'
      - 'recipe.yaml'
      - '.gitmodules'
      - 'deps/**'
      - 'config/shenyun-fixed-evidence.json'
      - 'config/shenyun-21x26-letter-buckets.json'
      - 'docs/shenyun-r9-mapping.json'
      - 'scripts/生成神韵固顶词.ts'
      - 'scripts/生成三拼简词.ts'
      - 'scripts/验证神韵双拼.ts'
      - 'scripts/固顶*.ts'
      - 'scripts/lib/**'
      - 'scripts/benchmark-latency*.ts'
      - 'scripts/summarize-latency.ts'
      - 'scripts/version*.ts'
      - 'scripts/workflows.test.ts'
      - 'scripts/research/calculate_shenyun_21x26_letter_buckets.ts'
      - 'scripts/generate-shenyun-letters.ts'
      - 'scripts/generate-keymaps.ts'
      - 'scripts/generate-skins.ts'
      - 'scripts/skin/**'
      - 'scripts/fixed-corpus/test/**'
      - 'scripts/fixed-corpus/evidence.ts'
      - 'scripts/fixed-corpus/types.ts'
      - 'scripts/package.json'
      - 'scripts/bun.lock'
      - 'tools/keymap-helper/**'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:
    inputs:
      schema:
        description: 只测试指定 schema_id；留空则测试全部方案
        required: false
        type: string
      deploy:
        description: 只运行指定 deploy；留空则运行全部场景
        required: false
        type: string

name: 测试

jobs:
  functional:
    name: 功能门禁
    uses: ./.github/workflows/functional.yml
    with:
      schema: ${{ inputs.schema }}
      deploy: ${{ inputs.deploy }}
  latency:
    name: 性能门禁
    uses: ./.github/workflows/latency.yml
