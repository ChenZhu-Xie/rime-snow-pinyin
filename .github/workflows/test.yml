on:
  push:
  workflow_dispatch:

name: 测试

jobs:
  validate-shenyun:
    name: 核验神韵双拼映射
    runs-on: ubuntu-24.04
    steps:
      - name: 获取代码
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
      - name: 安装校验依赖
        working-directory: scripts
        run: bun install --frozen-lockfile
      - name: 批量核验映射和固顶词
        run: |
          bun scripts/生成神韵固顶词.ts --check
          bun scripts/生成三拼简词.ts --check
          bun scripts/验证神韵双拼.ts

  test:
    name: 测试
    needs: validate-shenyun
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: 冰雪四拼
            schema: snow_sipin
          - name: 冰雪三拼
            schema: snow_sanpin
          - name: 冰雪一拼
            schema: snow_yipin
          - name: 冰雪键道
            schema: snow_jiandao
          - name: 冰雪清韵
            schema: snow_qingyun
          - name: 冰雪神韵·形
            schema: snow_shenyun_shape
          - name: 冰雪神韵·调
            schema: snow_shenyun_tone
    steps:
      - name: 获取代码
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: 准备方案依赖
        run: |
          cp rime-stroke/stroke* .
          cp spec/fixtures/default.yaml default.yaml
          sudo apt-get update
          sudo apt-get install --yes opencc
          mkdir -p opencc
          cp /usr/share/opencc/* opencc/
      - name: 安装 Mira
        run: |
          wget -O mira https://github.com/rimeinn/mira/releases/download/v0.3.0/mira-linux-x86_64
          chmod +x mira
          ./mira --version
      - name: ${{ matrix.name }}
        run: ./mira -C cache spec/${{ matrix.schema }}.test.yaml
