  schema_id: snow_zhudao
  name: 冰雪鹮道
  version: "0.3.14"
  author:
    - 谭淞宸 <i@tansongchen.com>
  description: |
    带调双拼＋键道形辅的 21×26 飞码式四码顶方案
    T2126-POLISHED-8832091：十韵组，上排二三声、中排四声、下排一轻声
    单字 AU 后最多四形辅；二／三／四字词稳健形辅字位顺序为 12/12/24，最多六码
  dependencies:
    - snow_pinyin
    - radical_pinyin
    - snow_bihua
    - snow_jiandao_chaifen

shenyun_options:
  auxiliary: shape

keymap:
  key: e
  image: snow_zhudao.svg

