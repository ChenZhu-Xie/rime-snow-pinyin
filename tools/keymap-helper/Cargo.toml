[package]
name = "snow-keymap"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
fs2 = "0.4.3"
resvg = "0.45.1"
softbuffer = "0.4.6"
winit = "0.30.13"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
