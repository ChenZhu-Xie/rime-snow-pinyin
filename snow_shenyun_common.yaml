# 冰雪神韵·形 / 冰雪神韵·调共用配置
# 21×26 R10-21X26-M39-08；,/. 只作普通标点。

__include: snow_pinyin.schema.yaml:/

engine:
  processors:
    - ascii_composer
    - lua_processor@*snow.abbreviation
    - lua_processor@*snow.select_character
    - lua_processor@*snow.popping
    - recognizer
    - lua_processor@*snow.code_navigator
    - lua_processor@*snow.user_dict
    - lua_processor@*snow.shape_processor
    - lua_processor@*snow.history
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - affix_segmentor@stroke
    - affix_segmentor@pinyin
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - lua_translator@*snow.shenyun
    - table_translator@stroke
    - script_translator@pinyin
    - lua_translator@*snow.datetime
    - lua_translator@*snow.number
    - lua_translator@*snow.calculator
    - lua_translator@*snow.history
  filters:
    - lua_filter@*snow.placeholder
    - reverse_lookup_filter@lookup_pinyin
    - lua_filter@*snow.fix
    - lua_filter@*snow.postpone
    - lua_filter@*snow.simplified
    - simplifier
    - uniquifier
    - lua_filter@*snow.hint

shenyun_algebra:
  # Common399 不编码的扩展音节。
  - erase/^(hng|m|n|ng|ê)\d$/
  # j/q/x 与零声母 yu 系列统一使用 v 韵尾语义。
  - xform/([jqx])uan(?=\d)/$1van/
  - xform/([jqx])ue(?=\d)/$1ve/
  - xform/([jqx])un(?=\d)/$1vn/
  - xform/([jqx])u(?=\d)/$1v/
  - xform/(^| )yuan(?=\d)/$1Yvan/
  - xform/(^| )yue(?=\d)/$1Yve/
  - xform/(^| )yun(?=\d)/$1Yvn/
  - xform/(^| )yu(?=\d)/$1Yv/
  # 零声母载体 A/E/O、W、Y 分别映射到 J、W、Y。
  - xform/(^| )(?=[aoe])/$1J/
  - xform/(^| )w/$1W/
  - xform/(^| )y/$1Y/
  # R10 21×26 的声母宿主键；合键依靠互斥的合法韵集合消歧。
  - xform/(^| )zh/$1F/
  - xform/(^| )ch/$1V/
  - xform/(^| )sh/$1D/
  - xform/(^| )f/$1X/
  - xform/(^| )d/$1R/
  - xform/(^| )q/$1W/
  - xform/(^| )x/$1X/
  - xform/(^| )r/$1Z/
  - xform/(^| )z/$1Q/
  # 26 个纯字母韵键；较长韵尾先行，保留 a/e/i/o/u 的原键。
  - xform/iang(?=\d)/V/
  - xform/iong(?=\d)/H/
  - xform/uang(?=\d)/K/
  - xform/ian(?=\d)/K/
  - xform/iao(?=\d)/C/
  - xform/ing(?=\d)/D/
  - xform/uai(?=\d)/R/
  - xform/uan(?=\d)/X/
  - xform/van(?=\d)/F/
  - xform/eng(?=\d)/N/
  - xform/ang(?=\d)/Y/
  - xform/ong(?=\d)/P/
  - xform/ai(?=\d)/J/
  - xform/an(?=\d)/L/
  - xform/ao(?=\d)/W/
  - xform/ei(?=\d)/Q/
  - xform/en(?=\d)/M/
  - xform/er(?=\d)/Q/
  - xform/ia(?=\d)/P/
  - xform/ie(?=\d)/Z/
  - xform/in(?=\d)/G/
  - xform/iu(?=\d)/B/
  - xform/ou(?=\d)/S/
  - xform/ua(?=\d)/D/
  - xform/ui(?=\d)/O/
  - xform/un(?=\d)/F/
  - xform/uo(?=\d)/H/
  - xform/ve(?=\d)/T/
  - xform/vn(?=\d)/X/
  - xform/v(?=\d)/R/
  - xform/a(?=\d)/A/
  - xform/e(?=\d)/E/
  - xform/i(?=\d)/I/
  - xform/o(?=\d)/O/
  - xform/u(?=\d)/U/
  - xform/\d//
  - xlit/QWERTYUIOPASDFGHJKLZXCVBNM/qwertyuiopasdfghjklzxcvbnm/

shenyun:
  dictionary: snow_pinyin
  prism: snow_shenyun
  packs:
    - snow_pinyin.base
    - snow_pinyin.ext
    - snow_pinyin.tencent
    - snow_pinyin.user
  enable_sentence: false
  enable_completion: false
  enable_user_dict: true
  preedit_format: null

speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  initials: bpmfdtnlgkhjqwvxrzcsy
  delimiter: " "
  popping:
    # 字母先尝试追加；无候选时顶出当前首选，再重放该键。
    - match: "^[a-z]+$"
      accept: "[a-z]"
      strategy: conditional
    # 标点先顶出候选，再由 punctuator 输出；逗号和句号不参与编码。
    - match: ".*[a-z0-9]"
      accept: "[^a-z0-9 ]"
  algebra:
    __include: /shenyun_algebra
    __append:
      - abbrev/^([bpmfdtnlgkhjqwvxrzcsy]).+$/$1/

lookup_shenyun:
  tags: [pinyin]
  overwrite_comment: true
  dictionary: snow_pinyin
  comment_format:
    __include: /shenyun_algebra

translator:
  prism: snow_shenyun
  preedit_format: null
  enable_schema_user_dict: true
  shape_elements: snow_jiandao_chaifen
  shape_mapping: "radical_jiandao.txt"
  shenyun_initial_keys: bpmfdtnlgkhjqwvxrzcsy
  shenyun_final_keys: abcdefghijklmnopqrstuvwxyz
  shenyun_auxiliary_keys: aeuio

switches:
  - name: ascii_mode
    states: [中文, 西文]
    reset: 0
  - name: full_shape
    states: [半角, 全角]
  - name: traditionalization
    states: [汉字, 漢字]
  - name: ascii_punct
    states: [。，, ．，]
  - name: popping
    states: [整句, 飞码]
    reset: 1
  - name: buffered
    states: [结束, 缓冲]
    reset: 0

menu:
  alternative_select_keys: "_23890"
  page_size: 6
