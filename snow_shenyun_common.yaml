# 冰雪神韵·形 / 冰雪神韵·调共用配置
# 21×28 均衡主案：, = in+ui；. = an。

__include: snow_pinyin.schema.yaml:/

engine:
  processors:
    - ascii_composer
    - lua_processor@*snow.abbreviation
    - lua_processor@*snow.select_character
    - lua_processor@*snow.popping
    - recognizer
    - lua_processor@*snow.code_navigator
    - lua_processor@*snow.user_dict
    - lua_processor@*snow.history
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - affix_segmentor@stroke
    - affix_segmentor@pinyin
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - lua_translator@*snow.shenyun
    - table_translator@stroke
    - script_translator@pinyin
    - lua_translator@*snow.datetime
    - lua_translator@*snow.number
    - lua_translator@*snow.calculator
    - lua_translator@*snow.history
  filters:
    - lua_filter@*snow.placeholder
    - reverse_lookup_filter@lookup_pinyin
    - lua_filter@*snow.fix
    - lua_filter@*snow.postpone
    - lua_filter@*snow.simplified
    - simplifier
    - uniquifier
    - lua_filter@*snow.hint

shenyun_algebra:
  # Common399 不编码的扩展音节。
  - erase/^(hng|m|n|ng|ê)\d$/
  # j/q/x 与零声母 yu 系列统一使用 v 韵尾语义。
  - xform/([jqx])uan(?=\d)/$1van/
  - xform/([jqx])ue(?=\d)/$1ve/
  - xform/([jqx])un(?=\d)/$1vn/
  - xform/([jqx])u(?=\d)/$1v/
  - xform/(^| )yuan(?=\d)/$1Yvan/
  - xform/(^| )yue(?=\d)/$1Yve/
  - xform/(^| )yun(?=\d)/$1Yvn/
  - xform/(^| )yu(?=\d)/$1Yv/
  # 零声母载体 A/E/O、W、Y 分别映射到 J、Q、Y。
  - xform/(^| )(?=[aoe])/$1J/
  - xform/(^| )w/$1Q/
  - xform/(^| )y/$1Y/
  # 复声母与唯一普通声母移位 x -> F；f 与 x 共键但合法韵集合互斥。
  - xform/(^| )zh/$1W/
  - xform/(^| )ch/$1V/
  - xform/(^| )sh/$1X/
  - xform/(^| )x/$1F/
  # 28 韵键；长韵母必须先变换。
  - xform/(uang|ing)(?=\d)/R/
  - xform/iang(?=\d)/H/
  - xform/iong(?=\d)/Y/
  - xform/ian(?=\d)/S/
  - xform/iao(?=\d)/L/
  - xform/uai(?=\d)/F/
  - xform/uan(?=\d)/W/
  - xform/van(?=\d)/X/
  - xform/(un|vn)(?=\d)/D/
  - xform/(in|ui)(?=\d)/,/
  - xform/uo(?=\d)/O/
  - xform/ve(?=\d)/Z/
  - xform/(ia|ong)(?=\d)/P/
  - xform/ie(?=\d)/M/
  - xform/iu(?=\d)/G/
  - xform/(ua|v)(?=\d)/B/
  - xform/ou(?=\d)/C/
  - xform/eng(?=\d)/T/
  - xform/ang(?=\d)/N/
  - xform/ai(?=\d)/Q/
  - xform/ao(?=\d)/V/
  - xform/ei(?=\d)/J/
  - xform/en(?=\d)/K/
  - xform/an(?=\d)/./
  - xform/(u|er)(?=\d)/U/
  - xform/a(?=\d)/A/
  - xform/e(?=\d)/E/
  - xform/i(?=\d)/I/
  - xform/o(?=\d)/O/
  - xform/\d//
  - xlit/QWERTYUIOPASDFGHJKLZXCVBNM/qwertyuiopasdfghjklzxcvbnm/

shenyun:
  dictionary: snow_pinyin
  prism: snow_shenyun
  packs:
    - snow_pinyin.base
    - snow_pinyin.ext
    - snow_pinyin.tencent
    - snow_pinyin.user
  enable_sentence: false
  enable_completion: false
  enable_user_dict: true
  preedit_format: null

speller:
  alphabet: abcdefghijklmnopqrstuvwxyz,.
  initials: bpmfdtnlgkhjqwvxrzcsy
  delimiter: " "
  popping:
    # 所有编码键都先尝试追加；无候选时顶出当前首选，再重放该键。
    # 因而 ,/. 在合法 U 位不顶功，在其他位置恢复为普通标点。
    - match: ".+"
      accept: "[abcdefghijklmnopqrstuvwxyz,.]"
      strategy: conditional
  algebra:
    __include: /shenyun_algebra
    __append:
      - abbrev/^([bpmfdtnlgkhjqwvxrzcsy]).+$/$1/

lookup_shenyun:
  tags: [pinyin]
  overwrite_comment: true
  dictionary: snow_pinyin
  comment_format:
    __include: /shenyun_algebra

translator:
  prism: snow_shenyun
  preedit_format: null
  enable_schema_user_dict: true
  shape_elements: snow_jiandao_chaifen
  shape_mapping: "radical_jiandao.txt"
  shenyun_initial_keys: bpmfdtnlgkhjqwvxrzcsy
  shenyun_final_keys: abcdefghijklmnopqrstuvwxyz,.
  shenyun_auxiliary_keys: aeuio

switches:
  - name: ascii_mode
    states: [中文, 西文]
    reset: 0
  - name: full_shape
    states: [半角, 全角]
  - name: traditionalization
    states: [汉字, 漢字]
  - name: ascii_punct
    states: [。，, ．，]
  - name: popping
    states: [整句, 飞码]
    reset: 1
  - name: buffered
    states: [结束, 缓冲]
    reset: 0

menu:
  alternative_select_keys: "_23890"
  page_size: 6
