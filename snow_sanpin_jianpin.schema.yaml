# Rime schema
# encoding: utf-8

__include: snow_pinyin.schema.yaml:/

schema:
  schema_id: snow_sanpin_jianpin
  name: 冰雪三拼简拼
  version: "0.3.11"
  author:
    - 谭淞宸 <i@tansongchen.com>
  description: |
    用于辅助三拼实现，非常规方案
  dependencies:
    - snow_pinyin

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    - lua_translator@*snow.history
  filters:
    - uniquifier
    - simplifier

speller:
  alphabet: bpmfdtnlgkhjqxzcsrwye
  delimiter: " '"
  algebra:
    __include: snow_sanpin.schema.yaml:/sanpin_algebra
    __append:
      # 三拼字母入口沿用本地神韵稀疏槽；与键道入口不同，故不能共用棱镜。
      - xform/~{1,2}([bpmfdtnlgkhjqxzcsrywe])/$1jo/
      - xform/~{1,2}([aviou])/kk$1/
      - derive/.([ivuao])$/?$1/ # 无韵母
      - xform/^([a-z])[^?]+$/$1/ # 简拼
      - derive/^.+$/~/ # 通配符

__patch:
  - patch
  - snow_sipin.custom:/patch?

patch:
  translator/prism: snow_sanpin_jianpin
